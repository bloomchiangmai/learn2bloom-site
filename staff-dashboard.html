<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home · Bloom Chiangmai staff</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- seo -->
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/staff.webmanifest?v=2">
<meta name="theme-color" content="#FDFAF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bloom staff">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/images/staff-icon-180.png?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="staff-shared.js"></script>
<script src="staff-todos.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#FDFAF5;color:#2C2C2A;}
/* 15 Nov: For you first, one text edge (rows and headings share 14px inside their card), no outlines */
main{max-width:1180px;margin:0;padding:40px 48px 100px;display:flex;flex-direction:column;gap:18px;}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 14px;margin-bottom:4px;}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.4px;color:#534AB7;text-transform:uppercase;margin-bottom:4px;}
h1{font-family:Georgia,serif;font-size:28px;font-weight:700;}
.quick{display:flex;flex-wrap:wrap;gap:8px;}
.quick a{font-size:14px;font-weight:600;text-decoration:none;padding:9px 16px;border-radius:10px;background:#EEEDFE;color:#534AB7;}
.quick a:hover{background:#E2E0FB;}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px;align-items:start;}
.colm{display:flex;flex-direction:column;}
.sec{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#6B6A64;font-weight:700;margin:14px 0 6px;padding:0 14px;display:flex;justify-content:space-between;}
.colm > .sec:first-child,.colm > div:first-child > .sec:first-child{margin-top:0;}
.sec{margin-top:18px;}
.sec i{font-style:normal;color:#534AB7;}
.list{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.list.soft{background:#F3EFE6;box-shadow:none;}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;gap:12px;align-items:center;padding:12px 14px;min-height:58px;text-decoration:none;color:inherit;cursor:pointer;background:none;border:0;width:100%;text-align:left;font:inherit;}
.row+.row,.row+.sublist,.sublist+.row{box-shadow:0 -1px 0 #ECE7DD;}
.row:hover{background:#FAF8F3;}.list.soft .row:hover{background:#EEE9DE;}
.row b{display:block;font-weight:600;font-size:15px;line-height:1.35;}
.list.soft .row b{font-weight:500;}
.row b.late{color:#A32D2D;}
.row small{display:block;color:#6B6A64;font-size:13px;margin-top:2px;}
.row .n{font-weight:700;color:#534AB7;font-size:15px;}
.row .chev{color:#B9B5AC;font-size:18px;line-height:1;}
.sublist{padding:2px 14px 8px;}
.sublist a{display:block;padding:9px 0;text-decoration:none;color:#2C2C2A;font-size:14px;}
.sublist a+a{box-shadow:0 -1px 0 #F0EBE2;}
.strip{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.strip a{padding:11px 14px;text-decoration:none;color:inherit;white-space:nowrap;overflow:hidden;}
.strip a+a{box-shadow:-1px 0 0 #ECE7DD;}
.strip a:hover{background:#FAF8F3;}
.strip b{display:block;font-family:Georgia,serif;font-size:22px;font-weight:700;}
.strip span{font-size:12.5px;color:#6B6A64;}
.strip span::after{content:" \203A";color:#B9B5AC;}
.calm{color:#6B6A64;font-size:14px;padding:8px 14px 0;line-height:1.45;}
.today{background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.trow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:10px 14px;font-size:14px;line-height:1.4;}
.trow+.trow{box-shadow:0 -1px 0 #ECE7DD;}
.trow .ta{color:#6B6A64;}
.trow a{color:#2C2C2A;text-decoration:none;}
.trow a:hover{color:#534AB7;}
.empty{background:#fff;border-radius:14px;padding:16px 14px;color:#6B6A64;font-size:14px;}
/* Placeholders while the numbers load, so nothing jumps from 0 */
.ph{background:#F0EBE2;border-radius:8px;height:58px;margin-bottom:2px;animation:pul 1.2s ease-in-out infinite;}
@keyframes pul{50%{opacity:.55}}
#authLoading{text-align:center;padding:80px 20px;color:#6B6A64;font-size:14px;}
.toast{position:fixed;bottom:24px;right:24px;background:#2C2C2A;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;display:none;z-index:99;}
@media (max-width:900px){ .cols{grid-template-columns:minmax(0,1fr);gap:0;} main{padding:24px 20px 80px;} }
@media (max-width:768px){
  main{padding:4px 16px 110px;gap:10px;}
  .head{padding:0 14px;}
  h1{font-size:22px;}
  .quick{display:none;}
  .strip span{font-size:11.5px;}
}
</style>
</head>
<body>

<div id="authLoading">Loading…</div>

<div id="pageContent" class="page-content" style="display:none;">
<main>
  <div class="head">
    <div>
      <div class="eyebrow" id="today"></div>
      <h1 id="greeting">Welcome</h1>
    </div>
    <nav class="quick" id="quick" aria-label="Quick actions"></nav>
  </div>
  <div class="cols">
    <div class="colm">
      <div class="sec" id="forHead">For you</div>
      <div id="forList"><div class="ph"></div><div class="ph"></div></div>
      <div id="watchBox" style="display:none"><div class="sec">Keep an eye on</div><div class="list soft" id="watchList"></div></div>
    </div>
    <div class="colm">
      <div id="stripBox" style="display:none"><div class="sec">Bloom</div><div class="strip" id="strip"></div></div>
      <p class="calm" id="calm"></p>
      <div id="todayBox" style="display:none"><div class="sec">Today</div><div class="today" id="todayList"></div></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>
</div>

<script>
window.STAFF_PAGE_KEY = 'dashboard';

// The home page answers one question: what needs me today?
// Each tool adds a line only when something needs this person. Open tools from the menu.
let OPEN_SUB = null;

async function onStaffReady(staffRow){
  const h = new Date().getHours();
  document.getElementById('greeting').textContent = `Good ${h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening'}, ${staffRow.name.split(' ')[0]}`;
  setDateLine('');
  window._isAdminOrIt = ['admin','director','it'].includes(window.currentStaffRole);
  await loadHome();
  setInterval(loadHome, 30000);
}
function setDateLine(closed){
  const d = new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'short' });
  document.getElementById('today').textContent = closed ? `${d} · ${closed}` : d;
}
const rowHtml = (l, i) => {
  const age = l.at ? waited(l.at) : '';
  const d = [l.d, age].filter(Boolean).map(escD).join(' · ');
  const inner = `<span><b class="${l.late ? 'late' : ''}">${escD(l.t)}</b>${d ? `<small>${d}</small>` : ''}</span><span class="n">${l.n ? escD(l.n) : ''}</span><span class="chev">${l.subOnly ? (OPEN_SUB === i ? '&#8964;' : '&#8250;') : '&#8250;'}</span>`;
  return l.subOnly
    ? `<button class="row" onclick="toggleSub(${i})">${inner}</button>${OPEN_SUB === i ? `<div class="sublist">${l.sub}</div>` : ''}`
    : `<a class="row" href="${l.href}">${inner}</a>`;
};

async function loadHome(){
  const results = await collectTodos();
  const all = k => results.flatMap(r => r[k] || []);
  const cards = all('cards').sort((a, b) => a.order - b.order), lines = all('lines'), today = all('today').sort((a, b) => a.order - b.order), quick = all('quick').sort((a, b) => a.order - b.order);
  const mine = lines.filter(l => !l.watch), watch = lines.filter(l => l.watch);
  // Oldest and late first: late, then by how long it has waited, then marketing due order
  mine.forEach((l, i) => l._i = i);
  mine.sort((a, b) => (b.late ? 1 : 0) - (a.late ? 1 : 0) || String(a.at || a.dueOrder || '9').localeCompare(String(b.at || b.dueOrder || '9')) || a._i - b._i);
  window._lines = mine;
  if(typeof setNavCounts === 'function') setNavCounts(mine);
  setDateLine(results.map(r => r.closed).find(Boolean) || '');

  document.getElementById('quick').innerHTML = quick.map(q => `<a href="${q.href}">+ ${escD(q.label)}</a>`).join('');
  document.getElementById('forHead').innerHTML = `For you${mine.length ? ` <i>${mine.length}</i>` : ''}`;
  document.getElementById('forList').innerHTML = mine.length
    ? `<div class="list">${mine.map(rowHtml).join('')}</div>`
    : '<div class="empty">Nothing needs you right now.</div>';
  document.getElementById('watchList').innerHTML = watch.map(l => rowHtml(l, -1)).join('');
  document.getElementById('watchBox').style.display = watch.length ? '' : 'none';

  // Numbers: only what is not zero and not already a To do above; the zeros become one quiet line
  const items = cards.flatMap(c => c.items);
  const show = items.filter(i => !i.act && Number(i.num) !== 0);
  const zeros = items.filter(i => Number(i.num) === 0 && i.zero).map(i => i.zero);
  const st = document.getElementById('strip');
  st.innerHTML = show.map(i => `<a href="${i.href || '#'}"><b>${escD(i.num)}</b><span>${escD(i.label)}</span></a>`).join('');
  st.style.setProperty('--n', Math.max(1, Math.min(3, show.length)));
  document.getElementById('stripBox').style.display = show.length ? '' : 'none';
  const z = zeros.map((t, k) => k ? t.charAt(0).toLowerCase() + t.slice(1) : t.charAt(0).toUpperCase() + t.slice(1));
  document.getElementById('calm').textContent = z.length ? z.join(', ') + '.' : '';
  document.getElementById('calm').style.display = z.length ? '' : 'none';

  const rows = today.flatMap(b => b.rows.map(([a, c]) => [b.h === 'Off today' ? (a === 'All day' ? 'Off' : a) : a, c]));
  document.getElementById('todayList').innerHTML = rows.map(([a, c]) => `<div class="trow"><span class="ta">${escD(a)}</span><span>${c}</span></div>`).join('');
  document.getElementById('todayBox').style.display = rows.length ? '' : 'none';
  if('setAppBadge' in navigator){ try{ mine.length ? navigator.setAppBadge(mine.length) : navigator.clearAppBadge(); }catch(e){} }
}
function toggleSub(i){ OPEN_SUB = OPEN_SUB === i ? null : i; loadHome(); }

checkStaffAndInit();
</script>

</body>
</html>
