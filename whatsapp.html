<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp — Bloom Chiangmai</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#FDFAF5;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;}
.logo{margin-bottom:32px;text-align:center;}
.logo img{height:60px;width:auto;}
.card{background:#fff;border:0.5px solid #E8E3D8;border-radius:16px;padding:40px 32px;text-align:center;max-width:400px;width:100%;}
.qr{width:260px;height:260px;object-fit:contain;margin:0 auto 24px;display:block;border-radius:8px;}
h2{font-family:'Lora',serif;font-size:18px;font-weight:700;color:#2C2C2A;margin-bottom:8px;}
p{font-size:13px;color:#888780;line-height:1.7;margin-bottom:16px;}
.id{font-size:12px;color:#AFA9EC;font-weight:500;}
.back{margin-top:24px;font-size:12px;color:#888780;text-decoration:none;display:inline-block;}
.back:hover{color:#534AB7;}
</style>
</head>
<body>
<div class="logo"><img src="images/bcm-logo.png" alt="Bloom Chiangmai"></div>
<div class="card">
  <img src="images/qr-whatsapp.png" alt="WhatsApp QR Code" class="qr">
  <h2>Scan to connect on WhatsApp</h2>
  <p>Open your phone camera and point it at this code to start a WhatsApp conversation with us.</p>

</div>
<a href="contact.html" class="back">← Back to contact</a>
</body>
</html>
