<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard — Bloom Chiangmai</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- seo -->
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="staff-shared.js"></script>
<script src="staff-todos.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#FDFAF5;color:#2C2C2A;}
/* S26: start next to the sidebar and use the width */
main{max-width:1240px;margin:0;padding:44px 48px 100px;display:flex;flex-direction:column;gap:24px;}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;color:#534AB7;text-transform:uppercase;margin-bottom:10px;}
h1{font-family:Georgia,serif;font-size:34px;font-weight:700;margin-bottom:6px;}
.summary{font-size:16px;color:#5F5E5A;}
.quick{display:flex;flex-wrap:wrap;gap:10px;}
.quick a{font-size:14px;font-weight:600;text-decoration:none;padding:9px 16px;border-radius:999px;border:1px solid #E8E3D8;background:#fff;color:#2C2C2A;}
.quick a:hover{border-color:#534AB7;color:#534AB7;}
.cards{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:14px;}
@media (max-width:1300px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:600px){.cards{grid-template-columns:minmax(0,1fr);}}
.card{background:#F7F3EC;border:1px solid #E8E3D8;border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:8px;}
.card-area{font-size:11px;letter-spacing:1.2px;font-weight:700;color:#6B6A64;}
.card-nums{display:flex;gap:28px;flex-wrap:nowrap;}
.card-lbl{white-space:nowrap;}
.card-nums a,.card-nums div{text-decoration:none;color:inherit;}
.card-num{font-family:Georgia,serif;font-size:26px;font-weight:700;color:#534AB7;}
.card-lbl{font-size:13px;color:#5F5E5A;}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px;align-items:stretch;}
.cols.single{grid-template-columns:minmax(0,1fr);}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr);} main{padding:32px 20px 80px;}}
.wbox,.tbox{background:#fff;border:1px solid #E8E3D8;border-radius:14px;padding:20px 24px;}
.wbox h2,.tbox h2{font-family:Georgia,serif;font-size:21px;margin-bottom:6px;}
.grp{margin-top:14px;}
.grp-head{display:flex;align-items:center;gap:10px;padding-bottom:6px;min-height:30px;}
.wtag{font-size:12px;font-weight:700;color:#3C3489;background:#EEEDFE;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.grp-n{font-size:13px;color:#6B6A64;}
.wl{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid #F0EBE2;flex-wrap:wrap;}
.wtxt{flex:1 1 240px;font-size:15px;line-height:1.4;}
.wtxt .late{color:#A32D2D;font-weight:600;}
.wbtn{font-size:14px;font-weight:600;text-decoration:none;padding:8px 14px;border:1px solid #CECBF6;border-radius:8px;color:#534AB7;background:#fff;cursor:pointer;font-family:inherit;white-space:nowrap;}
.wbtn:hover{border-color:#534AB7;}
.quiet{font-size:15px;color:#5F5E5A;padding:10px 0 4px;}
.sublist{width:100%;padding:0;}
.sublist a{display:block;padding:8px 0;border-top:1px solid #F3EFE6;text-decoration:none;color:#2C2C2A;font-size:14px;}
.tblock{margin-top:14px;}
.tblock-h{font-size:11px;letter-spacing:1.2px;font-weight:700;color:#6B6A64;padding-bottom:6px;min-height:30px;display:flex;align-items:center;}
.trow{display:flex;gap:12px;padding:8px 0;border-top:1px solid #F0EBE2;font-size:14px;line-height:1.4;}
.trow .ta{flex:0 0 92px;color:#6B6A64;white-space:nowrap;}
.trow .tb{flex:1;min-width:0;}
.trow a{color:#2C2C2A;text-decoration:none;}
.trow a:hover{color:#534AB7;}
#authLoading{text-align:center;padding:80px 20px;color:#888780;font-size:14px;}
.toast{position:fixed;bottom:24px;right:24px;background:#2C2C2A;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;display:none;z-index:99;}
</style>
</head>
<body>

<div id="authLoading">Loading…</div>

<div id="pageContent" class="page-content" style="display:none;">
<main>
  <div class="head">
    <div>
      <div class="eyebrow" id="today"></div>
      <h1 id="greeting">Welcome</h1>
      <p class="summary" id="summary"></p>
    </div>
    <nav class="quick" id="quick" aria-label="Quick actions"></nav>
  </div>

  <div class="cards" id="cards"></div>

  <div class="cols" id="cols">
    <section class="wbox" aria-labelledby="waitTitle">
      <h2 id="waitTitle">Waiting on you</h2>
      <div id="waitList"><p class="quiet">Loading…</p></div>
    </section>
    <aside class="tbox" id="todayBox" aria-labelledby="todayTitle" style="display:none;">
      <h2 id="todayTitle">Today</h2>
      <div id="todayList"></div>
    </aside>
  </div>
</main>

<div class="toast" id="toast"></div>
</div>

<script>
window.STAFF_PAGE_KEY = 'dashboard';

// The home page answers one question: what needs me today?
// Each tool adds a line only when something needs this person. Open tools from the menu.
let OPEN_SUB = null;

async function onStaffReady(staffRow){
  const now = new Date(), h = now.getHours();
  document.getElementById('today').textContent = now.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
  document.getElementById('greeting').textContent = `Good ${h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening'}, ${staffRow.name.split(' ')[0]}`;
  window._isAdminOrIt = window.currentStaffRole === 'admin' || window.currentStaffRole === 'director' || window.currentStaffRole === 'it';
  await loadHome();
  setInterval(loadHome, 30000);
}

async function loadHome(){
  const results = await collectTodos();
  const all = k => results.flatMap(r => r[k] || []);
  const cards = all('cards').sort((a, b) => a.order - b.order), lines = all('lines'), today = all('today').sort((a, b) => a.order - b.order), quick = all('quick').sort((a, b) => a.order - b.order);
  window._lines = lines;
  if(typeof setNavCounts === 'function') setNavCounts(lines);

  document.getElementById('summary').textContent = lines.length ? `${plural(lines.length, 'thing waits', 'things wait')} for you across Bloom.` : 'Nothing waits for you right now.';
  document.getElementById('quick').innerHTML = quick.map(q => `<a href="${q.href}">+ ${escD(q.label)}</a>`).join('');

  const cEl = document.getElementById('cards');
  cEl.innerHTML = cards.map(c => `<div class="card"><div class="card-area">${escD(c.area.toUpperCase())}</div><div class="card-nums">${c.items.map(i =>
    `<${i.href ? `a href="${i.href}"` : 'div'}><div class="card-num">${escD(i.num)}</div><div class="card-lbl">${escD(i.label)}</div></${i.href ? 'a' : 'div'}>`).join('')}</div></div>`).join('');
  cEl.style.display = cards.length ? '' : 'none';
  cEl.style.setProperty('--n', Math.min(4, Math.max(1, cards.length)));

  // Waiting on you, grouped by where it comes from
  const groups = [];
  lines.forEach((l, i) => { let g = groups.find(x => x.tag === l.tag); if(!g){ g = { tag: l.tag, items: [] }; groups.push(g); } g.items.push([l, i]); });
  document.getElementById('waitTitle').textContent = lines.length ? `Waiting on you: ${lines.length}` : 'Waiting on you';
  document.getElementById('waitList').innerHTML = lines.length
    ? groups.map(g => `<div class="grp"><div class="grp-head"><span class="wtag">${escD(g.tag)}</span><span class="grp-n">${g.items.length}</span></div>${g.items.map(([l, i]) => `<div class="wl">
        <span class="wtxt">${l.html}</span>
        ${l.subOnly ? `<button class="wbtn" onclick="toggleSub(${i})">${OPEN_SUB === i ? 'Hide' : l.btn}</button>` : `<a class="wbtn" href="${l.href}">${escD(l.btn)}</a>`}
        ${l.sub && l.subOnly && OPEN_SUB === i ? `<div class="sublist">${l.sub}</div>` : ''}
      </div>`).join('')}</div>`).join('')
    : '<p class="quiet">Nothing needs you right now. Open any tool from the menu.</p>';

  document.getElementById('todayList').innerHTML = today.map(b => `<div class="tblock"><div class="tblock-h">${escD(b.h.toUpperCase())}</div>${b.rows.map(([a, c]) => `<div class="trow"><span class="ta">${escD(a)}</span><span class="tb">${c}</span></div>`).join('')}</div>`).join('');
  document.getElementById('todayBox').style.display = today.length ? '' : 'none';
  document.getElementById('cols').classList.toggle('single', !today.length);
}
function toggleSub(i){ OPEN_SUB = OPEN_SUB === i ? null : i; loadHome(); }

checkStaffAndInit();
</script>

</body>
</html>
