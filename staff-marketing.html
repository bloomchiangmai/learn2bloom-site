<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marketing HQ — Bloom Chiangmai</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- seo -->
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="staff-shared.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#FDFAF5;color:#2C2C2A;width:100%;font-size:14px;line-height:1.5;}
button,input,select,textarea{font:inherit;color:inherit;}
a{color:#534AB7;}

main{max-width:1180px;margin:0 auto;padding:48px 32px 100px;min-height:70vh;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;color:#534AB7;text-transform:uppercase;margin-bottom:14px;}
h1{font-family:Georgia,serif;font-size:32px;font-weight:700;color:#2C2C2A;margin-bottom:8px;}
.sub{font-size:15px;color:#5F5E5A;max-width:680px;}
.top-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap;}

/* main tabs */
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;border-bottom:1px solid #E8E3D8;margin-bottom:28px;}
.sidebar-logo{border-bottom:none !important;padding-bottom:4px !important;}
.hq-head{padding:0 20px 14px;border-bottom:1px solid #E8E3D8;}
.hq-app{font-size:13px;font-weight:600;color:#534AB7;margin-bottom:8px;}
.hq-back{font-size:13px;font-weight:600;color:#534AB7;text-decoration:none;}
.hq-back:hover{text-decoration:underline;}
.hq-link{display:flex !important;align-items:center;justify-content:space-between;}
.hq-n{font-size:11px;font-weight:700;color:#fff;background:#534AB7;border-radius:999px;padding:1px 8px;margin-left:8px;}
.sidebar-link.active .hq-n{background:#fff;color:#534AB7;}
.hq-n.late,.sidebar-link.active .hq-n.late{background:#C0392B;color:#fff;}
.tab{background:none;border:0;padding:10px 12px;font-size:15px;font-weight:600;color:#5F5E5A;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tab:hover{color:#2C2C2A;}
.tab.on{color:#534AB7;border-bottom-color:#534AB7;}
.tab .n{font-weight:400;color:#A8A39A;font-size:12px;margin-left:4px;}
.tab-sep{width:1px;height:20px;background:#E8E3D8;margin:0 8px;}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:-12px 0 24px;}
.pill{background:#fff;border:1px solid #DCD5C6;border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600;color:#5F5E5A;cursor:pointer;white-space:nowrap;}
.pill:hover{border-color:#888780;}
.pill.on{background:#534AB7;border-color:#534AB7;color:#fff;}
.pill .n{font-weight:400;opacity:.7;margin-left:3px;}

.btn-primary{padding:10px 20px;border:none;border-radius:8px;background:#534AB7;color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn-primary:hover{background:#443c99;}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;}
.btn-outline{padding:9px 16px;border:1px solid #DCD5C6;border-radius:8px;background:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.btn-outline:hover{border-color:#888780;}
.btn-danger{padding:9px 16px;border:1px solid #EBC3B4;border-radius:8px;background:#fff;color:#A23F1C;font-size:14px;font-weight:600;cursor:pointer;}
.link-btn{background:none;border:0;color:#534AB7;font-weight:600;font-size:13px;cursor:pointer;padding:0;}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.tools input,.tools select{border:1px solid #DCD5C6;background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;}
.tools input{min-width:240px;}
.tools .count{color:#888780;font-size:12px;}

.card{background:#F7F3EC;border:1px solid #E8E3D8;border-radius:12px;padding:22px 24px;}
.card h2{font-family:Georgia,serif;font-size:19px;font-weight:700;color:#2C2C2A;display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.card .why{color:#888780;font-size:13px;margin:2px 0 14px;}

/* table */
.tbl{background:#fff;border:1px solid #E8E3D8;border-radius:12px;overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;padding:10px 12px;border-bottom:2px solid #E8E3D8;color:#5F5E5A;font-size:12px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;background:#FCFBF8;}
td{padding:10px 12px;border-bottom:1px solid #E8E3D8;vertical-align:top;}
tr:last-child td{border-bottom:0;}
tbody tr{cursor:pointer;} tbody tr:hover td{background:#FBF9F4;}
td.main{font-weight:600;min-width:200px;}
td.nowrap{white-space:nowrap;}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#5F5E5A;max-width:340px;}
.muted{color:#888780;}

/* chips */
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#F1EFE8;color:#5F5E5A;white-space:nowrap;}
.chip.plum{background:#EEEDFE;color:#534AB7;} .chip.amber{background:#FDF1DF;color:#9A5D0C;}
.chip.rust{background:#FBE9E2;color:#A23F1C;} .chip.leaf{background:#E3F1EC;color:#0F6E56;}
.chip.blue{background:#E6F0FA;color:#1F5E99;}
.fmt{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#888780;border:1px solid #DCD5C6;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;}
.ready{display:inline-flex;gap:4px;}
.ready span{font-size:10.5px;font-weight:700;letter-spacing:.3px;border-radius:4px;padding:1px 5px;border:1px solid #DCD5C6;color:#B5B0A8;}
.ready span.ok{background:#E3F1EC;border-color:#E3F1EC;color:#0F6E56;}

/* pipeline strip */
.pipe{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.pipe button{min-width:110px;flex:0 0 auto;}
.pipe button{background:#fff;border:1px solid #E8E3D8;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;}
.pipe button:hover{border-color:#DCD5C6;}
.pipe button.on{border-color:#534AB7;box-shadow:0 0 0 1px #534AB7;}
.pipe .num{font-family:Georgia,serif;font-size:22px;font-weight:700;line-height:1.1;}
.pipe .lbl{font-size:12px;color:#5F5E5A;}

/* reference cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.entry{background:#fff;border:1px solid #E8E3D8;border-radius:12px;padding:18px 20px;cursor:pointer;}
.entry:hover{border-color:#DCD5C6;}
.entry h3{font-family:Georgia,serif;font-weight:700;font-size:17px;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.kv{margin-top:8px;}
.kv b{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#888780;font-weight:700;}
.kv span{white-space:pre-wrap;}

/* overview */
.ov{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.ov .wide{grid-column:1/-1;}
.goal{background:#2C2C2A;color:#F7F3EC;border-radius:12px;padding:20px 24px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:20px;align-items:start;}
.goal .lbl{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#B5B0A8;margin-bottom:4px;font-weight:700;}
.goal .big{font-family:Georgia,serif;font-size:20px;line-height:1.3;}
.goal .val{font-size:15px;font-weight:600;}
.goal .edit{color:#F5C842;font-size:12px;cursor:pointer;background:none;border:0;padding:0;margin-top:8px;text-decoration:underline;}
.month-line{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.list{list-style:none;}
.list li{padding:9px 0;border-bottom:1px solid #E8E3D8;display:flex;justify-content:space-between;gap:12px;cursor:pointer;align-items:baseline;}
.list li:last-child{border-bottom:0;}
.list .t{font-weight:600;}
.list .s{color:#888780;font-size:12px;text-align:right;white-space:nowrap;}
.empty-state{color:#888780;font-size:14px;padding:22px;text-align:center;border:1px dashed #DCD5C6;border-radius:12px;background:#FCFBF8;}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(44,44,42,.28);display:none;z-index:80;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#FDFAF5;border-left:1px solid #E8E3D8;z-index:81;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;}
.drawer.wide{width:min(980px,100%);}
.dw-open .scrim{display:block;} .dw-open .drawer{transform:none;}
.drawer header{padding:18px 22px;border-bottom:1px solid #E8E3D8;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.drawer header h3{font-family:Georgia,serif;font-size:19px;font-weight:700;}
.drawer .body{padding:18px 22px;overflow:auto;flex:1;}
.drawer footer{padding:14px 22px;border-top:1px solid #E8E3D8;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;}
.f{margin-bottom:14px;}
.f label{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#888780;font-weight:700;margin-bottom:5px;}
.f label .hint{text-transform:none;letter-spacing:0;font-weight:400;color:#A8A39A;}
.f input,.f select,.f textarea{width:100%;border:1px solid #DCD5C6;background:#fff;border-radius:8px;padding:9px 11px;font-size:14px;}
.f textarea{min-height:90px;resize:vertical;line-height:1.5;}
.f textarea.tall{min-height:220px;overflow:hidden;resize:none;line-height:1.55;}
.thnote{background:#FAEEDA;color:#633806;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.aicmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;}
.aicmp .lbl2{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#3C3489;margin-bottom:4px;}
.aicmp .txt{background:#fff;border:1px solid #DCD5C6;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.aicmp ins{background:#E1F5EE;color:#085041;text-decoration:none;border-radius:3px;}
.aicmp del{background:#FCEBEB;color:#791F1F;border-radius:3px;}
.tagchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.tagchip{border:1px solid #DCD5C6;border-radius:999px;padding:4px 10px;font-size:12.5px;background:#fff;cursor:pointer;color:#5F5E5A;}
.tagchip.on{background:#EEEDFE;border-color:#AFA9EC;color:#3C3489;font-weight:600;}
.adminline{font-size:12.5px;color:#854F0B;margin:10px 0 0;}
.nexthint{font-size:12px;color:#888780;text-align:right;margin-top:6px;}
.fbwrap{background:#F1EFE8;border-radius:12px;padding:16px;margin:4px 0 14px;}
.fbcard{max-width:500px;margin:0 auto;background:#fff;border-radius:10px;border:1px solid #E5E1D8;padding:14px 16px;font-family:Helvetica,Arial,sans-serif;}
.fbhead{display:flex;gap:10px;align-items:center;margin-bottom:10px;} .fbav{width:40px;height:40px;border-radius:50%;background:#EEEDFE;color:#3C3489;display:flex;align-items:center;justify-content:center;font-weight:700;}
.fbname{font-weight:700;font-size:14px;} .fbtime{font-size:12px;color:#65676B;}
.fbtext{font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;color:#050505;}
.fbmore{border-top:1px dashed #C9C3B6;margin:8px 0;padding-top:4px;font-size:11.5px;color:#888780;}
.fbrest{color:#9A968C;} .fbimg{margin-top:10px;border-radius:6px;max-width:100%;display:block;}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid #EEEDFE;border-color:#534AB7;}
.grid-meta{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1.3fr;gap:10px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.sec-label{font-family:Georgia,serif;font-size:15px;font-weight:700;margin:6px 0 10px;padding-top:12px;border-top:1px solid #E8E3D8;}
details.orig{margin-bottom:14px;}
details.orig summary{cursor:pointer;font-size:13px;font-weight:600;color:#534AB7;margin-bottom:8px;}
.f .openl{font-size:12px;margin-top:4px;display:inline-block;}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:#888780;}
.confirm{display:none;gap:8px;align-items:center;font-size:13px;color:#A23F1C;}
.meta{color:#888780;font-size:12px;}
.goalbox{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;grid-template-rows:auto auto auto;column-gap:20px;row-gap:4px;background:#534AB7;border:1px solid #534AB7;border-radius:16px;padding:20px 26px;margin-bottom:14px;}
.goalbox .gcol{display:grid;grid-row:span 3;grid-template-rows:subgrid;min-width:0;}
.goalbox .glbl{align-self:end;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#CECBF6;font-weight:700;}
.goalbox .gval{align-self:baseline;font-size:17px;font-weight:700;color:#FFFFFF;margin-top:4px;overflow-wrap:anywhere;}
.goalbox .gval.gbig{font-family:Georgia,serif;font-size:23px;}
.goalbox .gval.none{color:#CECBF6;font-weight:600;}
.goalbox .gedit{justify-self:start;align-self:start;margin-top:8px;font-size:13px;font-weight:600;color:#FFFFFF;background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;font-family:inherit;}
.ground-h{font-size:11px;letter-spacing:1.2px;color:#6B6A64;font-weight:700;margin:4px 0 8px;}
.gtile{display:block;text-align:left;font:inherit;color:#2C2C2A;background:#fff;border:1px solid #E8E3D8;border-radius:12px;padding:12px 16px;cursor:pointer;width:100%;}
.gtile:hover{border-color:#CECBF6;}
.gtile .gt{display:flex;align-items:baseline;gap:8px;white-space:nowrap;}
.gtile .gn{font-family:Georgia,serif;font-size:22px;font-weight:700;}
.gtile .gl{font-size:14px;font-weight:600;}
.gtile .gs{font-size:12px;color:#6B6A64;margin-top:2px;}
.gbar{height:6px;border-radius:3px;background:#E8E3D8;margin-top:10px;overflow:hidden;display:flex;}
.gbar span{display:block;height:100%;}
.goal-line{display:flex;align-items:center;gap:12px;padding:12px 18px;border:1px solid #E8E3D8;border-radius:12px;background:#fff;margin-bottom:14px;cursor:pointer;}
.goal-line .lbl{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#888780;font-weight:700;}
.goal-line .val{font-family:Georgia,serif;font-size:17px;font-weight:700;}
.goal-line .meta2{color:#888780;font-size:13px;}
.goal-line .act{margin-left:auto;color:#534AB7;font-weight:600;font-size:13px;white-space:nowrap;}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px;}
.tile{background:#F7F3EC;border:1px solid #E8E3D8;border-radius:12px;padding:16px 18px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;}
.tile:hover{border-color:#DCD5C6;} .tile.on{border-color:#534AB7;box-shadow:0 0 0 1px #534AB7;}
.tile .n{font-family:Georgia,serif;font-size:30px;font-weight:700;line-height:1.1;}
.tile .l{font-size:13px;color:#5F5E5A;margin-top:2px;}
.tile .n.warn{color:#9A5D0C;} .tile .n.bad{color:#A23F1C;} .tile .n.good{color:#0F6E56;}
.drop{background:#fff;border:1px solid #E8E3D8;border-radius:12px;padding:6px 18px;margin:-4px 0 14px;}
.cal-wrap{background:#fff;border:1px solid #E8E3D8;border-radius:12px;padding:16px 18px;margin-bottom:14px;}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cal-head h2{font-family:Georgia,serif;font-size:18px;font-weight:700;}
.cal-nav{background:none;border:1px solid #DCD5C6;border-radius:6px;width:28px;height:28px;cursor:pointer;color:#5F5E5A;}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
.cal .dow{font-size:11px;color:#A8A39A;text-transform:uppercase;letter-spacing:.5px;padding:0 4px;}
.cal .day{min-height:58px;border-radius:8px;background:#FCFBF8;border:1px solid #F0ECE3;padding:4px 6px;font-size:12px;color:#888780;}
.cal .day.out{background:transparent;border-color:transparent;}
.cal .day.today{border-color:#534AB7;color:#534AB7;font-weight:700;}
.cal .day.past{color:#C9C4BA;}
.cal .pp{display:block;margin-top:3px;font-size:11px;font-weight:600;line-height:1.25;border-radius:4px;padding:2px 5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:#5F5E5A;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#F1EFE8;}
.bar button{border:0;height:100%;cursor:pointer;}
.bar-lbl{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:12px;color:#5F5E5A;}
.queue-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.copybtn{margin-left:8px;font-size:11px;font-weight:600;text-transform:none;letter-spacing:0;color:#534AB7;background:#EEEDFE;border:0;border-radius:4px;padding:2px 8px;cursor:pointer;}
.step{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid #F0ECE3;}
.step:first-of-type{border-top:0;}
.step-ic{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;}
.step-tx{flex:1;min-width:0;} .step-tx .t{font-weight:600;font-size:15px;} .step-tx .s{font-size:12.5px;color:#888780;}
.step-btn{padding:8px 14px;font-size:13px;flex:none;}
.mnav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.mnav h2{font-family:Georgia,serif;font-size:20px;font-weight:700;min-width:170px;text-align:center;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.chips button{border:0;cursor:pointer;}
.chips button.on{box-shadow:0 0 0 2px #534AB7;}
.cap{background:#fff;border:1px solid #E8E3D8;border-radius:10px;padding:12px 14px;white-space:pre-wrap;font-size:14px;max-height:240px;overflow:auto;margin-bottom:6px;}
.ref-sec{margin-bottom:34px;}
.ref-sec .top-bar{margin-bottom:12px;}
.ref-sec h2{font-family:Georgia,serif;font-size:21px;font-weight:700;}
.box{background:#fff;border:1px solid #E8E3D8;border-radius:12px;padding:14px 18px 6px;margin-bottom:14px;scroll-margin-top:20px;}
.bh{font-family:Georgia,serif;font-size:17px;font-weight:700;margin-bottom:4px;}
.bh.bad{color:#A23F1C;} .bh.warn{color:#9A5D0C;}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #F0ECE3;cursor:pointer;}
.bh+.prow{border-top:0;}
.prow:hover .t{color:#534AB7;}
.dot{width:10px;height:10px;border-radius:50%;flex:none;}
a.btn-primary{text-decoration:none;color:#fff;display:inline-block;} a.btn-outline{text-decoration:none;color:#2C2C2A;display:inline-block;}
.cap.ro{background:#F3EFE7;border:0;border-left:3px solid #DCD5C6;border-radius:4px;}
.donebox{background:#E1F5EE;color:#085041;border-radius:10px;padding:14px 16px;margin-top:18px;font-size:13px;font-weight:600;}
.donebox .f label{color:#888780;}
.plist{font-size:13.5px;}
.pl{display:grid;grid-template-columns:118px minmax(0,1fr) 92px 110px 112px 112px;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid #F0ECE3;}
.pl.head{border-top:0;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#A8A39A;font-weight:700;padding-top:4px;}
.pl.opened{background:#EEF4FC;border-radius:8px 8px 0 0;border-top-color:transparent;}
.pl.hl{background:#FFF6D6;transition:background .6s;}
.pt{display:flex;align-items:center;min-width:0;}
.ptt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.late-d{color:#A23F1C;font-weight:600;}
.mks{display:inline-flex;gap:4px;}
.mk{text-decoration:none;cursor:pointer;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;color:#B5B0A8;border:1px solid #E8E3D8;}
.mk.ok{background:#E3F1EC;border-color:#E3F1EC;color:#0F6E56;}
.mk.no{background:#FCEBEB;border-color:#F7C1C1;color:#A32D2D;}
a.mk:hover{border-color:#534AB7;color:#534AB7;}
.mkey .mk{cursor:default;}
.sm{padding:5px 11px;font-size:12.5px;border-radius:7px;white-space:nowrap;}
.ppanel{background:#EEF4FC;border-radius:0 0 8px 8px;padding:4px 12px 16px 130px;margin-bottom:4px;}

// Word-level difference between two texts, kept simple (longest common subsequence on words).
function wordDiff(a, b){
  const A = String(a||'').split(/(\s+)/), B = String(b||'').split(/(\s+)/);
  const n = A.length, m = B.length;
  if(n*m > 400000) return { left: esc(a), right: esc(b) };
  const L = Array.from({length:n+1}, ()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j] = A[i]===B[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  let i=0, j=0, left='', right='';
  while(i<n && j<m){
    if(A[i]===B[j]){ left += esc(A[i]); right += esc(B[j]); i++; j++; }
    else if(L[i+1][j] >= L[i][j+1]){ left += /^\s+$/.test(A[i]) ? esc(A[i]) : `<del>${esc(A[i])}</del>`; i++; }
    else { right += /^\s+$/.test(B[j]) ? esc(B[j]) : `<ins>${esc(B[j])}</ins>`; j++; }
  }
  while(i<n){ left += /^\s+$/.test(A[i]) ? esc(A[i]) : `<del>${esc(A[i])}</del>`; i++; }
  while(j<m){ right += /^\s+$/.test(B[j]) ? esc(B[j]) : `<ins>${esc(B[j])}</ins>`; j++; }
  return { left, right };
}

// ---------- Reference (edited here) ----------
const REF_PER_PAGE = 15, REF_PAGE = {}, REF_FILTER = {}, REF_SORT = {};
// Item 68: click a column header to sort. Stages sort by meaning, counts by number, empty values always last.
const SORT_STAGE = {status:['Active','Joined','Pending approval','To verify','Avoid','To do','Doing','Waiting','Done'], relationship:['Partner','Meeting held','Contacted','Not contacted'], fit:['Very High','High','Medium-High','Medium','Low'], job_posts:['Yes','Specific days only','Admin approval','Unknown','No'], promo:['Yes','Specific days only','Admin approval','Unknown','No']};
const SORT_NUM = new Set(['members','followers']);
function refCmp(key, dir){
  return (a, b) => {
    const x = a[key], y = b[key], ex = x == null || x === '', ey = y == null || y === '';
    if(ex || ey) return ex && ey ? 0 : ex ? 1 : -1;
    let c;
    if(SORT_NUM.has(key)) c = memberCount(y) - memberCount(x);
    else if(SORT_STAGE[key]){ const o = SORT_STAGE[key], i = o.indexOf(x), j = o.indexOf(y); c = (i<0?99:i) - (j<0?99:j) || String(x).localeCompare(String(y)); }
    else c = String(x).localeCompare(String(y), undefined, {sensitivity:'base', numeric:true});
    return dir * c;
  };
}
function refSort(k, key){
  const cur = REF_SORT[k];
  REF_SORT[k] = !cur || cur.key !== key ? {key, dir:1} : cur.dir === 1 ? {key, dir:-1} : null;
  REF_PAGE[k] = 0; render();
}
function renderGroup(el, g){
  const k = g.secs[0], s = SEC[k]; let rows = (DATA[k]||[]).slice();
  if(s.sort) rows.sort((a,b)=>String(a[s.sort]||'9999').localeCompare(String(b[s.sort]||'9999')));
  if(s.rank) rows.sort(s.rank);
  const all = rows.length, fv = s.filter ? REF_FILTER[k] || '' : '';
  let filters = '';
  if(s.filter){
    const vals = [...new Set(rows.map(r=>r[s.filter]).filter(Boolean))].sort((a,b)=>{ const i=AUD.indexOf(a), j=AUD.indexOf(b); return (i<0?99:i)-(j<0?99:j) || a.localeCompare(b); });
    const btn = (v, t, n) => `<button class="${v===fv?'on':''}" onclick="refFilter('${k}','${esc(v)}')">${esc(t)} <span class="n">${n}</span></button>`;
    filters = `<div class="reffilter">${btn('', 'All', all)}${vals.map(v=>btn(v, v, rows.filter(r=>r[s.filter]===v).length)).join('')}</div>`;
    if(fv) rows = rows.filter(r=>r[s.filter]===fv);
  }
  if(REF_SORT[k]) rows.sort(refCmp(REF_SORT[k].key, REF_SORT[k].dir));
  const pages = Math.max(1, Math.ceil(rows.length / REF_PER_PAGE));
  const pg = Math.min(REF_PAGE[k] || 0, pages - 1); REF_PAGE[k] = pg;
  const from = pg * REF_PER_PAGE, part = rows.slice(from, from + REF_PER_PAGE);
  const pager = rows.length > REF_PER_PAGE ? `<div class="refpager"><span class="muted">${from+1} to ${from+part.length} of ${rows.length}</span><button class="btn-outline sm" ${pg===0?'disabled':''} onclick="refPage('${k}',-1)" aria-label="Previous page">&#8249;</button><button class="btn-outline sm" ${pg>=pages-1?'disabled':''} onclick="refPage('${k}',1)" aria-label="Next page">&#8250;</button></div>` : '';
  el.innerHTML = `<section class="ref-sec" id="ref-${k}"><div class="top-bar"><div><h2>${esc(s.t)} <span class="muted" style="font-family:inherit;font-size:14px;font-weight:400">${all}</span></h2><p class="meta" style="font-size:13px">${esc(s.d)}</p></div>
      ${canEdit?`<button class="btn-outline" onclick="editRef('${k}')">Add</button>`:''}</div>
      ${filters}${rows.length ? table(s, part, fv ? [s.filter] : [], true) + pager : '<div class="empty-state">Nothing here yet.</div>'}</section>`;
}
function refFilter(k, v){ REF_FILTER[k] = v; REF_PAGE[k] = 0; render(); }
function refPage(k, d){ REF_PAGE[k] = (REF_PAGE[k] || 0) + d; render(); window.scrollTo(0, 0); }
// Clicking an entry opens it read-only on the side; Edit opens the form (editors only).
function viewRef(k, id){

  cur = {k, id, view:true};

  const linkHtml = lk ? `<div class="rv"><div class="rv-k">Link</div><div class="rv-v">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(String(r[lk]).replace(/^https?:\/\/(www\.)?/,'').slice(0,60))} &#8599;</a>` : r[lk] ? esc(r[lk]) : `<span class="muted">No link yet</span>${canEdit?` · <a href="javascript:void 0" onclick="editRef('${k}','${id}')">Add link</a>`:''}`}</div></div>` : '';
  // Item 70: who to contact comes first, then the link, then the rest.
  const lastContact = Math.max(...['person','phone','email'].map(c=>s.f.findIndex(f=>f[0]===c)));
  const kv = s.f.map((f, i) => {
    if(f[0]===s.title) return '';
    if(f[0]===lk) return lastContact < 0 ? linkHtml : '';
    const v = r[f[0]], after = i === lastContact && lk ? linkHtml : '';
    if(!v) return after;
    const tel = String(v).replace(/[^+\d]/g,''), mail = /^[^\s@<>"']+@[^\s@<>"']+\.[a-z]{2,}$/i.test(String(v).trim());
    const val = f[0]==='phone' && tel.length >= 6 ? `<a href="tel:${tel}">${esc(v)}</a>` : f[0]==='email' && mail ? `<a href="mailto:${esc(String(v).trim())}">${esc(v)}</a>` : f[2]==='url' && safeUrl(v) ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(String(v).replace(/^https?:\/\/(www\.)?/,'').slice(0,60))}</a>` : f[2]==='date' ? fmtDate(v) : f[2]==='select' ? chip(v) : esc(v).replace(/\n/g,'<br>');
    return `<div class="rv"><div class="rv-k">${esc(f[1])}</div><div class="rv-v">${val}</div></div>` + after; }).join('');
  $('#drawer').className = 'drawer';
  $('#drawer').innerHTML = `<header><h3>${esc(r[s.title]||'Entry')}</h3><button class="x" onclick="closeD()" aria-label="Close">×</button></header>
    <div class="body">${kv || '<p class="meta">No details yet.</p>'}${metaLine(r)}</div>
    <footer><div></div><div style="display:flex;gap:8px"><button class="btn-outline" onclick="closeD()">Close</button>${canEdit?`<button class="btn-primary" onclick="editRef('${k}','${id}')">Edit</button>`:''}</div></footer>`;
  $('#dw').classList.add('dw-open');
}
function label(s,key){ return (s.f.find(x=>x[0]===key)||[0,key])[1]; }
function cell(s,key,v){ const f = s.f.find(x=>x[0]===key); if(!f) return esc(v);
  if(f[2]==='date') return fmtDate(v); if(f[2]==='select') return QUIET.has(v) ? `<span class="quiet">${esc(v)}</span>` : (key==='audience' || key==='use_for') ? `<span class="plain">${esc(v)}</span>` : chip(v); if(f[2]==='long') return `<span class="clip">${esc(v)}</span>`; return esc(v); }
function table(s,rows,hide=[],sortable=false){
  const cols = s.cols.filter(c=>!hide.includes(c)), so = sortable && REF_SORT[s.k];
  const th = c => sortable ? `<th class="sortable${so && so.key===c ? ' sorted' : ''}" onclick="refSort('${s.k}','${c}')" aria-sort="${so && so.key===c ? (so.dir===1?'ascending':'descending') : 'none'}">${label(s,c)}<span class="arr">${so && so.key===c ? (so.dir===1?'▲':'▼') : '↕'}</span></th>` : `<th>${label(s,c)}</th>`;
  const tag = r => s.tag && r[s.tag] && r[s.tag] !== s.f.find(f=>f[0]===s.tag)[3][0] ? ` <span class="rowtag">${esc(r[s.tag])}</span>` : '';
  return `<div class="tbl"><table><thead><tr>${th(s.title)}${cols.map(th).join('')}</tr></thead><tbody>
  ${rows.map(r=>`<tr onclick="viewRef('${s.k}','${r.id}')"><td class="main">${esc(r[s.title])}${tag(r)}</td>
  ${cols.map(c=>`<td>${cell(s,c,r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function cards(s,rows){
  return `<div class="cards">${rows.map(r=>`<div class="entry" onclick="editRef('${s.k}','${r.id}')">
    <h3><span>${esc(r[s.title])}</span>${chip(r[s.chip])}</h3>
    ${s.f.filter(f=>f[0]!==s.title&&f[0]!==s.chip&&r[f[0]]).map(f => f[2]==='url' && safeUrl(r[f[0]])
      ? `<div class="kv"><b>${f[1]}</b><span><a href="${esc(r[f[0]])}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(String(r[f[0]]).replace(/^https?:\/\/(www\.)?/,'').slice(0,48))}</a></span></div>`
      : `<div class="kv"><b>${f[1]}</b><span>${f[2]==='date'?fmtDate(r[f[0]]):esc(r[f[0]])}</span></div>`).join('')}
  </div>`).join('')}</div>`;
}

// ---------- Drawer ----------
let cur = null, saving = false;
function closeD(){ $('#dw').classList.remove('dw-open'); cur = null; }
$('#scrim').onclick = closeD;
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeD(); });
function field(f, v, cls='', extra=''){ const [k,l,t,o,hint] = f; v = v ?? '';
  const inp = t==='long' ? `<textarea name="${k}" class="${cls}">${esc(v)}</textarea>`
    : t==='select' ? `<select name="${k}"><option value=""></option>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}${v&&!o.includes(v)?`<option selected>${esc(v)}</option>`:''}</select>`
    : `<input name="${k}" type="${t==='date'?'date':t==='url'?'url':t==='time'?'time':'text'}" value="${esc(v)}">`;
  const open = t==='url' && safeUrl(v) ? `<a class="openl" href="${esc(v)}" target="_blank" rel="noopener">Open</a>` : '';
  return `<div class="f"><label>${l}${hint?` <span class="hint">${hint}</span>`:''}${extra}</label>${inp}${open}</div>`; }
function metaLine(r){
  if(!r || !r._updated) return '';
  const who = r._by && nameOf(r._by) ? ' by ' + esc(nameOf(r._by)) : '';
  return `<div class="meta">Last updated ${new Date(r._updated).toLocaleString('en-GB')}${who}${r.source?' · '+esc(r.source):''}</div>`;
}
// ---------- Item 79: Plan several ----------
// Give dates to ideas in one go, or paste rows (topic, date, label) from the Google Sheet.
// Rows without a date, and topics already planned, are flagged and skipped. People come from the pickers at the top (item 85).
let PL = null;
const normT = t => String(t||'').toLowerCase().replace(/[^a-z0-9ก-๙]+/g,' ').trim();
const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
function parseDay(t){
  t = String(t||'').trim(); if(!t) return '';
  const pad = n => String(n).padStart(2,'0'), now = new Date(), Y = now.getFullYear();
  const mk = (d, m, y) => {
    if(!(m>=1 && m<=12 && d>=1 && d<=31)) return '';
    if(y === undefined){ y = Y; if(new Date(y, m-1, d) < new Date(now.toDateString())) y++; }
    else if(y < 100) y += 2000;
    const dt = new Date(y, m-1, d); return dt.getMonth() === m-1 ? `${y}-${pad(m)}-${pad(d)}` : '';
  };
  let m;
  if((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return mk(+m[3], +m[2], +m[1]);
  if((m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?$/))) return mk(+m[1], +m[2], m[3] === undefined ? undefined : +m[3]);
  if((m = t.match(/^(\d{1,2})\s+([a-z]{3,9})\.?,?(?:\s+(\d{2,4}))?$/i)) && MON[m[2].toLowerCase().slice(0,3)]) return mk(+m[1], MON[m[2].toLowerCase().slice(0,3)], m[3] === undefined ? undefined : +m[3]);
  return '';
}
function planSeveral(){
  const ideas = POSTS.filter(p=>openStep(p) && !p.post_date).sort((a,b)=>String(a.title).localeCompare(String(b.title)));
  PL = { who:{ writer: TEAM[ME] ? ME : '', pic:'', translator:'', poster:'' }, tab:'ideas', q:'', paste:'', rows: ideas.map(p=>({ key:'i'+p.id, src:'idea', id:p.id, title:p.title, date:'', label:p.label||'', thai: p.needs_thai !== false, on:false })), pasted:[] };
  drawerShell('Plan several', '<div id="plBody"></div>', null, true);
  $('#sv').textContent = 'Plan 0 posts'; $('#sv').onclick = planRun;
  planDraw();
}
function planCheck(){
  const dated = new Map(POSTS.filter(p=>openStep(p) && p.post_date).map(p=>[normT(p.title), p]));
  const ideaT = new Set(POSTS.filter(p=>openStep(p) && !p.post_date).map(p=>normT(p.title)));
  const seen = new Set(), labels = new Set(LABELS.map(l=>l.name));
  const all = [...PL.rows, ...PL.pasted];
  all.forEach(r => { r.flag = ''; r.skip = false; r.badLabel = false; });
  all.filter(r=>r.on).forEach(r => {
    const k = normT(r.title), d = dated.get(k);
    if(!r.title.trim()){ r.flag = 'Needs a topic'; r.skip = true; }
    else if(d){ r.flag = `Already planned for ${fmtShort(d.post_date)}. Skipped.`; r.skip = true; }
    else if(r.src === 'paste' && ideaT.has(k)){ r.flag = 'Already in Ideas: plan it from the Ideas tab. Skipped.'; r.skip = true; }
    else if(seen.has(k)){ r.flag = 'Same topic as another row. Only one will be planned.'; r.skip = true; }
    else if(!r.date){ r.flag = 'Needs a posting date'; r.skip = true; }
    if(r.label && !labels.has(r.label)){ r.badLabel = true; if(!r.flag) r.flag = `No label called "${r.label}". It will be left blank.`; }
    if(!r.skip) seen.add(k);
  });
  return all.filter(r=>r.on && !r.skip);
}
function planRow(r){
  const opts = `<option value="">Label</option>${LABELS.map(l=>`<option ${l.name===r.label?'selected':''}>${esc(l.name)}</option>`).join('')}`;
  return `<div class="pl-r ${r.on?'':'off'}"><input type="checkbox" class="tick" ${r.on?'checked':''} onchange="planSet('${r.key}','on',this.checked)" aria-label="Plan ${esc(r.title)}">
    ${r.src==='paste' ? `<input class="pl-in" value="${esc(r.title)}" onchange="planSet('${r.key}','title',this.value)" aria-label="Topic">` : `<span class="pl-t" title="${esc(r.title)}">${esc(r.title)}</span>`}
    <input type="date" class="pl-in ${r.on && !r.date ? 'need' : ''}" value="${r.date}" onchange="planSet('${r.key}','date',this.value)" aria-label="Posting date">
    <select class="pl-in" onchange="planSet('${r.key}','label',this.value)" aria-label="Label">${opts}</select>
    <label class="pl-th"><input type="checkbox" class="tick" ${r.thai?'checked':''} onchange="planSet('${r.key}','thai',this.checked)"> Thai</label>
    ${r.flag ? `<div class="pl-flag ${r.skip?'skip':''}">${esc(r.flag)}</div>` : ''}</div>`;
}
function planDraw(){
  if(!PL || !$('#plBody')) return;
  const ready = planCheck(), ticked = [...PL.rows, ...PL.pasted].filter(r=>r.on);
  const head = `<div class="pl-r pl-head"><span></span><span>TOPIC</span><span>POSTING DATE</span><span>LABEL</span><span>THAI</span></div>`;
  const tabs = `<div class="reffilter"><button class="${PL.tab==='ideas'?'on':''}" onclick="planTab('ideas')">From ideas <span class="n">${PL.rows.length}</span></button><button class="${PL.tab==='paste'?'on':''}" onclick="planTab('paste')">Paste from the sheet</button></div>`;
  let body;
  if(PL.tab === 'ideas'){
    const q = normT(PL.q), list = PL.rows.filter(r=>!q || normT(r.title).includes(q));
    body = `<input class="pl-in pl-search" placeholder="Search ideas" value="${esc(PL.q)}" oninput="PL.q=this.value;planDrawList()">
      <div id="plList">${head}${list.map(planRow).join('') || '<p class="meta" style="padding:10px 0">No ideas match.</p>'}</div>`;
  } else {
    body = `<label class="pl-lbl">Paste rows: topic, date, label</label>
      <textarea class="pl-in pl-paste" placeholder="Father's Day at Bloom&#9;4/12/2026&#9;Holiday" oninput="planPaste(this.value)">${esc(PL.paste)}</textarea>
      <div id="plList">${PL.pasted.length ? `<label class="pl-lbl">Read as ${PL.pasted.length} post${PL.pasted.length===1?'':'s'}</label>${head}${PL.pasted.map(planRow).join('')}` : ''}</div>`;
  }
  const pick = (k, lab, empty) => `<div><label>${lab}</label><select class="pl-in" onchange="PL.who.${k}=this.value" aria-label="${lab}">${personOptions(PL.who[k], empty, k==='pic'||k==='translator')}</select></div>`;
  const who = `<div class="pl-who">${pick('writer','WRITER','Pick a writer')}${pick('pic','REVIEWER','Pick a reviewer')}${pick('translator','TRANSLATOR','Pick a translator')}${pick('poster','POSTER','The writer posts it')}</div>`;
  $('#plBody').innerHTML = who + tabs + body;
  const skipped = ticked.length - ready.length;
  $('#sv').textContent = `Plan ${ready.length} post${ready.length===1?'':'s'}`;
  $('#sv').disabled = !ready.length;
  $('#msg').textContent = ticked.length ? `${ticked.length} ticked${skipped ? ' · ' + skipped + ' skipped' : ''}` : '';
}
function planDrawList(){ const y = ($('#plList')||{}).scrollTop; planDraw(); const s = $('.pl-search'); if(s){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
function planTab(t){ PL.tab = t; planDraw(); }
function planSet(key, f, v){
  const r = [...PL.rows, ...PL.pasted].find(x=>x.key===key); if(!r) return;
  r[f] = v; if(f==='date' && v) r.on = true; if(f==='title') r.title = String(v).trim();
  planDraw();
}
function planPaste(txt){
  PL.paste = txt;
  PL.pasted = txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map((l, i) => {
    const c = (l.includes('\t') ? l.split('\t') : l.includes(',') ? l.split(',') : l.split(/\s{2,}/)).map(x=>x.trim());
    const title = c[0] || '', date = parseDay(c[1] || ''), lab = c[2] || '';
    const label = (LABELS.find(x=>x.name.toLowerCase()===lab.toLowerCase()) || {}).name || lab;
    const th = (c[3]||'').toLowerCase();
    return { key:'p'+i, src:'paste', title, date, label, thai: !/^(no|english|en|false|n)$/.test(th), on:true, raw:c[1] || '' };
  });
  const ta = $('.pl-paste'), pos = ta ? ta.selectionStart : 0;
  planDraw();
  const t2 = $('.pl-paste'); if(t2){ t2.focus(); t2.setSelectionRange(pos, pos); }
}
async function planRun(){
  const ready = planCheck(); if(!ready.length) return;
  const U = PL.who, b = $('#sv'); b.disabled = true; b.textContent = 'Working…';
  let ok = 0; const fails = [];
  for(const r of ready){
    const people = {};
    const p = r.src === 'idea' ? POSTS.find(x=>x.id===r.id) : null;
    if(U.writer && p && !p.writer) people.writer = U.writer;
    if(U.pic && !(p && p.pic)) people.pic = U.pic;
    if(r.thai && U.translator && !(p && p.translator)) people.translator = U.translator;
    if(U.poster && !(p && p.poster)) people.poster = U.poster;
    const pay = { post_date: r.date, needs_thai: !!r.thai, ...(r.label && !r.badLabel ? { label: r.label } : {}), ...people };
    let res;
    if(r.src === 'idea') res = await sb.rpc('mkt_post', { p_action:'edit_topic', p_id:r.id, p: pay });
    else res = await sb.rpc('mkt_post', { p_action:'create', p_id:null, p: { title:r.title, ...pay, writer: U.writer || ME } });
    if(res.error) fails.push(`${r.title}: ${res.error.message.replace(/^.*?: /,'')}`); else ok++;
  }
  await reloadPosts(true);
  closeD(); render();
  showToast(`${ok} post${ok===1?'':'s'} planned.` + (fails.length ? ` ${fails.length} could not be planned: ${fails.join('; ')}` : ''));
}
function drawerShell(title, body, id, wide){
  const ro = !canEdit;
  $('#drawer').className = 'drawer' + (wide ? ' wide' : '');
  $('#drawer').innerHTML = `<header><h3>${title}</h3><button class="x" onclick="closeD()">×</button></header>
    <form class="body" id="fm" onsubmit="return false">${body}</form>
    <footer><div>${id && canDelete ? `<button class="btn-danger" id="del">Delete</button><span class="confirm" id="cf">Delete this? <button class="btn-danger" id="yes">Yes, delete</button><button class="btn-outline" id="no">Keep</button></span>` : ''}</div>
    <div style="display:flex;gap:8px;align-items:center"><span id="msg" style="font-size:12px;color:#A23F1C"></span><button class="btn-outline" onclick="closeD()">${ro?'Close':'Cancel'}</button>${ro?'':'<button class="btn-primary" id="sv">Save</button>'}</div></footer>`;
  if(ro) $('#fm').querySelectorAll('input,select,textarea').forEach(e=>e.disabled=true);
  $('#dw').classList.add('dw-open');
  if($('#del')){
    $('#del').onclick = () => { $('#del').style.display='none'; $('#cf').style.display='flex'; };
    $('#no').onclick = () => { $('#del').style.display=''; $('#cf').style.display='none'; };
    $('#yes').onclick = async () => {
      const { error } = await sb.from('marketing_entries').delete().eq('id', id);
      if(error){ $('#msg').textContent = 'Could not delete: ' + error.message; return; }
      closeD(); showToast('Deleted.'); loadAll(); };
  }
}
function readForm(keys){
  const fd = new FormData($('#fm')); const body = {};
  keys.forEach(k => { const v = String(fd.get(k) ?? '').trim(); if(v) body[k] = v; });
  return body;
}
async function persist(collection, id, body){
  if(saving) return; saving = true; const b = $('#sv'); if(b) b.disabled = true;
  const { error } = id
    ? await sb.from('marketing_entries').update({ data: body }).eq('id', id)
    : await sb.from('marketing_entries').insert({ collection, data: body });
  saving = false; if($('#sv')) $('#sv').disabled = false;
  if(error){ $('#msg').textContent = 'Could not save: ' + error.message; return; }
  closeD(); showToast('Saved.'); loadAll();
}

// Reference / tasks editor
function editRef(k, id){
  const s = SEC[k]; const r = id ? (DATA[k]||[]).find(x=>x.id===id) : {}; if(id && !r) return;
  cur = {k, id};
  drawerShell(id ? esc(r[s.title]||'Entry') : 'New entry', s.f.map(f=>field(f, r[f[0]])).join('') + metaLine(r), id, false);
  if($('#sv')) $('#sv').onclick = () => {
    const data = readForm(s.f.map(f=>f[0]));
    if(!data[s.title]){ $('#msg').textContent = label(s, s.title) + ' is required.'; return; }
    persist(k, id, data);
  };
  setTimeout(()=>{ const first = $('#fm [name]'); if(first && !id && canEdit) first.focus(); }, 50);
}
function editPlan(){
  if(!canEditPlan()) return;
  const P = PLAN || {}; cur = {plan:true};
  drawerShell('Goal and targets', PLAN_FIELDS.map(f=>field(f, P[f[0]])).join('') + metaLine(PLAN), null, false);
  if($('#sv')) $('#sv').onclick = () => persist('plan', PLAN && PLAN.id, { ...planData(), ...readForm(PLAN_FIELDS.map(f=>f[0])) });
}

// ---------- Boot ----------
async function onStaffReady(){
  if(!canAccess('marketing', 'view')){ window.location.href = 'staff-dashboard.html'; return; }
  canEdit = canAccess('marketing', 'edit');
  canDelete = canAccess('marketing', 'full');
  ME = window.currentStaff && window.currentStaff.id;
  const st = await sb.from('bloom_settings').select('marketing_enabled').limit(1).maybeSingle();
  HQ_OFF = !!(st && st.data && st.data.marketing_enabled === false);
  render();
  if(HQ_OFF && !canManageAccess()) return;
  await loadAccess();
  await loadAll();
  listen();
}
let curHash = location.hash, skipHash = false;
window.addEventListener('hashchange', () => {
  if(skipHash){ skipHash = false; curHash = location.hash; return; }
  if(curHash.startsWith('#post/') && dirty() && !confirm('You have unsaved changes on this post. Leave without saving?')){ skipHash = true; location.hash = curHash; return; }
  curHash = location.hash; filt.q=''; filt.s=''; closeD(); render(); window.scrollTo(0,0);
});
window.addEventListener('beforeunload', e => { if(dirty()){ e.preventDefault(); e.returnValue = ''; } });

window.STAFF_PAGE_KEY = 'marketing';
checkStaffAndInit();
