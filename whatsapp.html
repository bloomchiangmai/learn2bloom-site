<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-QH3NWGK088');
// Contact click events (line_click, whatsapp_click, wechat_click): fire on clicks on any
// LINE, WhatsApp or WeChat link, and on taps on the QR image of the matching page.
var bcmChannels = [
  ['line_click', /line\.me|lin\.ee|116mdcau/, /\/line(\.html)?([?#]|$)/],
  ['whatsapp_click', /wa\.me|api\.whatsapp\.com|whatsapp:\/\//, /\/whatsapp(\.html)?([?#]|$)/],
  ['wechat_click', /weixin:\/\/|u\.wechat\.com|wechat\.com/, /\/wechat(\.html)?([?#]|$)/],
  ['email_click', /^mailto:/, /^mailto:/]
];
document.addEventListener('click', function (e) {
  var t = e.target;
  if (!t || !t.closest) return;
  var a = t.closest('a[href]');
  // Buttons that navigate with onclick="window.location.href='...'" count like links
  var btn = !a && t.closest('button[onclick]');
  var bm = btn && /location\.href\s*=\s*'([^']+)'/.exec(btn.getAttribute('onclick') || '');
  if (bm) a = { href: new URL(bm[1], location.href).href, target: '', textContent: btn.textContent, isButton: true };
  var url = a ? a.href.toLowerCase() : null, label = a ? (a.textContent || '').trim().slice(0, 100) : 'qr image';
  if (!a) {
    if (!t.closest('img.qr')) return;
    url = location.href.toLowerCase();
  }
  for (var i = 0; i < bcmChannels.length; i++) {
    var c = bcmChannels[i];
    if (c[1].test(url) || c[2].test(url)) {
      gtag('event', c[0], { link_url: a ? a.href : location.href, link_text: label });
      if (window.fbq) fbq('track', 'Contact', { content_name: c[0] });
      // Same-tab links (e.g. /line, whatsapp.html) unload the page before Meta's request is sent:
      // hold the navigation briefly so the event gets out. New-tab and mailto links are left alone.
      if (a && window.fbq && !/^mailto:/i.test(a.href) && (a.target || '').toLowerCase() !== '_blank'
          && !e.defaultPrevented && e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey) {
        e.preventDefault();
        if (a.isButton) e.stopPropagation();
        var dest = a.href;
        setTimeout(function () { window.location.href = dest; }, 400);
      }
      return;
    }
  }
}, true);
</script>
