<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff Admissions — Bloom Chiangmai</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#FDFAF5;color:#2C2C2A;width:100%;}
nav{display:flex;align-items:center;justify-content:space-between;padding:10px max(48px, calc((100% - 1200px) / 2 + 48px));background:#FDFAF5;border-bottom:1px solid #E8E3D8;}
.logo{font-family:Georgia,serif;font-size:22px;font-weight:700;color:#2C2C2A;text-decoration:none;}
.nav-tabs{display:flex;gap:8px;}
.nav-tab{font-size:13px;font-weight:600;padding:8px 16px;border-radius:8px;text-decoration:none;color:#5F5E5A;}
.nav-tab.active{background:#534AB7;color:#fff;}

main{max-width:1100px;margin:0 auto;padding:60px 24px 100px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;color:#534AB7;text-transform:uppercase;margin-bottom:14px;}
h1{font-family:Georgia,serif;font-size:32px;font-weight:700;color:#2C2C2A;margin-bottom:8px;}
.sub{font-size:15px;color:#5F5E5A;margin-bottom:40px;}

.card{background:#F7F3EC;border:1px solid #E8E3D8;border-radius:12px;padding:28px;margin-bottom:32px;}
.card h2{font-family:Georgia,serif;font-size:20px;font-weight:700;margin-bottom:20px;color:#2C2C2A;}

.login-box{max-width:420px;margin:80px auto;text-align:center;}
.login-box input{width:100%;padding:12px 14px;border:1px solid #E8E3D8;border-radius:8px;font-size:15px;margin-bottom:12px;background:#fff;}
.login-box button{width:100%;padding:12px;border:none;border-radius:8px;background:#534AB7;color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.login-box button:hover{background:#443c99;}
.error-msg{color:#B23A3A;font-size:13px;margin-top:10px;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.form-grid label{display:block;font-size:12px;font-weight:600;color:#5F5E5A;margin-bottom:6px;}
.form-grid input,.form-grid select{width:100%;padding:10px 12px;border:1px solid #E8E3D8;border-radius:8px;font-size:14px;background:#fff;}
.full-width{grid-column:1 / -1;}

.btn-primary{padding:12px 24px;border:none;border-radius:8px;background:#534AB7;color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.btn-primary:hover{background:#443c99;}
.btn-small-outline{padding:6px 12px;font-size:12px;border:1px solid #534AB7;border-radius:6px;background:#fff;color:#534AB7;cursor:pointer;}

table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;padding:10px 12px;border-bottom:2px solid #E8E3D8;color:#5F5E5A;font-size:12px;text-transform:uppercase;letter-spacing:.5px;}
td{padding:10px 12px;border-bottom:1px solid #E8E3D8;vertical-align:top;}
.status-select{font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid #E8E3D8;background:#fff;}

.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.signout-link{font-size:13px;color:#888780;cursor:pointer;text-decoration:underline;}
.toast{position:fixed;bottom:24px;right:24px;background:#2C2C2A;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;display:none;z-index:99;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(44,44,42,0.5);z-index:100;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:#FDFAF5;border-radius:12px;max-width:720px;width:100%;max-height:85vh;overflow-y:auto;padding:32px;position:relative;}
.modal-close{position:absolute;top:20px;right:20px;background:none;border:none;font-size:20px;cursor:pointer;color:#888780;}
.modal-box h2{font-family:Georgia,serif;font-size:24px;margin-bottom:4px;}
.modal-box .modal-sub{font-size:13px;color:#888780;margin-bottom:24px;}
.detail-section{margin-bottom:24px;}
.detail-section h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#534AB7;margin-bottom:10px;border-bottom:1px solid #E8E3D8;padding-bottom:6px;}
.detail-row{display:flex;gap:16px;margin-bottom:8px;font-size:14px;align-items:center;}
.detail-label{width:180px;flex-shrink:0;color:#5F5E5A;}
.detail-value{color:#2C2C2A;flex:1;}
.detail-input{flex:1;padding:8px 10px;border:1px solid #E8E3D8;border-radius:6px;font-size:14px;background:#fff;font-family:inherit;}
.modal-save-bar{position:sticky;bottom:0;background:#FDFAF5;padding-top:16px;margin-top:8px;border-top:1px solid #E8E3D8;display:flex;justify-content:flex-end;gap:10px;}

@media (max-width: 768px) {
  nav{flex-direction:column;gap:10px;padding:14px 20px;}
  .form-grid{grid-template-columns:1fr;}
  table{font-size:12px;}
  th,td{padding:8px 6px;}
  .detail-label{width:120px;}
  .modal-box{padding:20px;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Bloom Chiangmai</a>
  <div class="nav-tabs">
    <a href="staff-admissions.html" class="nav-tab active">Admissions</a>
    <a href="learners.html" class="nav-tab">Learners</a>

</nav>

    <div class="card">

      <div class="form-grid">

          <label>First name</label>
          <input type="text" id="firstName" placeholder="Alice">
        </div>
        <div>
          <label>Last name</label>
          <input type="text" id="lastName" placeholder="Smith">
        </div>
        <div class="full-width">
          <label>Family name</label>
          <input type="text" id="familyName" placeholder="Smith Family">
        </div>
        <div>
          <label>Family contact email</label>
          <input type="email" id="familyEmail" placeholder="parent@example.com">
        </div>
        <div>
          <label>Class group</label>

        <div>

          </div>

</main>

<footer style="background:#F7F3EC;padding:22px max(48px, calc((100% - 1200px) / 2 + 48px)) 40px;border-top:1px solid #E8E3D8;">
  <p style="text-align:center;font-size:12px;color:#888780;">© 2026 Bloom Chiangmai Learning Hub. All rights reserved.</p>
</footer>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modalContent">Loading…</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ndlcfgkhxjoancdvmgmr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EzlLIeKJDqtMs0mKD0gfgA_C86iHZal';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allData = [];

function toggleMoreDetails(){
  const section = document.getElementById('moreDetailsSection');
  const label = document.getElementById('moreDetailsLabel');
  const isHidden = section.style.display === 'none';
  section.style.display = isHidden ? 'block' : 'none';
  label.textContent = isHidden ? '– Hide extra details' : '+ Add more details (optional)';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(()=>{ t.style.display='none'; }, 3000);
}

function nextStudentIdCode(existingCodes){
  const year = new Date().getFullYear();
  let n = 1;
  const prefix = `BCM-${year}-`;
  const nums = existingCodes
    .filter(c => c && c.startsWith(prefix))
    .map(c => parseInt(c.replace(prefix,''),10))
    .filter(x => !isNaN(x));
  if(nums.length) n = Math.max(...nums) + 1;
  return prefix + String(n).padStart(4,'0');
}

async function checkStaffAndInit(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    document.getElementById('loginView').style.display = 'block';
    document.getElementById('adminView').style.display = 'none';
    return;
  }
  const { data: staffRow } = await sb.from('staff').select('*').eq('auth_user_id', session.user.id).maybeSingle();
  if(!staffRow){
    document.getElementById('loginError').textContent = 'This account is not registered as staff.';
    document.getElementById('loginView').style.display = 'block';
    document.getElementById('adminView').style.display = 'none';
    await sb.auth.signOut();
    return;
  }
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('adminView').style.display = 'block';
  loadStudents();
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Enter email and password.'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = error.message; return; }
  checkStaffAndInit();
}

async function doLogout(){
  await sb.auth.signOut();
  checkStaffAndInit();
}

async function loadStudents(){
  const tbody = document.getElementById('studentsTable');
  const { data, error } = await sb
    .from('students')
    .select('*, families(family_name, contact_email, contact_phone, intake_data)')
    .neq('status', 'enrolled')
    .order('created_at', { ascending: false });

  if(error){
    tbody.innerHTML = `<tr><td colspan="5" style="color:#B23A3A;">${error.message}</td></tr>`;
    return;
  }
  allData = data;
  if(!data.length){
    tbody.innerHTML = `<tr><td colspan="5" style="color:#888780;">No applications in the pipeline.</td></tr>`;
    return;
  }

  const statuses = ['enquiry','application','interview','approved','offer_sent','payment_received','withdrawn'];

  tbody.innerHTML = data.map(s => `
    <tr>
      <td>${s.first_name} ${s.last_name}</td>
      <td>${s.families ? s.families.family_name : '—'}</td>
      <td>${s.class_group || '—'}</td>
      <td>
        <select class="status-select" onchange="updateStatus('${s.id}', this.value)">
          ${statuses.map(st => `<option value="${st}" ${st===s.status?'selected':''}>${st.replace('_',' ')}</option>`).join('')}
        </select>
      </td>
      <td><button class="btn-small-outline" onclick="openModal('${s.id}')">View</button></td>
    </tr>
  `).join('');
}

async function updateStatus(studentId, newStatus){
  const { error } = await sb.from('students').update({ status: newStatus }).eq('id', studentId);
  if(error){ showToast('Error: ' + error.message); return; }
  showToast('Status updated to ' + newStatus.replace('_',' '));
  loadStudents();
}

function openModal(studentId){
  renderModal(studentId, false);
}

function renderModal(studentId, editMode){
  const s = allData.find(x => x.id === studentId);
  if(!s) return;
  const fam = s.families || {};
  const famIntake = fam.intake_data || {};
  const studIntake = s.intake_data || {};

  const field = (label, value, inputHtml) => `
    <div class="detail-row">
      <div class="detail-label">${label}</div>
      ${editMode ? inputHtml : `<div class="detail-value">${value || '—'}</div>`}
    </div>`;

  document.getElementById('modalContent').innerHTML = `
    <h2>${s.first_name} ${s.last_name}</h2>
    <p class="modal-sub">${fam.family_name || 'No family on file'} · Status: ${s.status.replace('_',' ')}</p>

    <div class="detail-section">
      <h3>Internal notes (staff only)</h3>
      ${field('Notes', s.staff_notes, `<textarea class="detail-input" id="f-staff-notes" rows="3" style="resize:vertical;">${s.staff_notes || ''}</textarea>`)}
    </div>

    <div class="detail-section">
      <h3>Learner details</h3>
      ${field('First name', s.first_name, `<input class="detail-input" id="f-first-name" value="${s.first_name || ''}">`)}
      ${field('Last name', s.last_name, `<input class="detail-input" id="f-last-name" value="${s.last_name || ''}">`)}
      ${field('Date of birth', s.date_of_birth, `<input class="detail-input" type="date" id="f-dob" value="${s.date_of_birth || ''}">`)}
      ${field('Class group', s.class_group, `
        <select class="detail-input" id="f-class-group">
          <option value="" ${!s.class_group?'selected':''}>— Select —</option>
          <option ${s.class_group==='Nest'?'selected':''}>Nest</option>
          <option ${s.class_group==='Early Explorers'?'selected':''}>Early Explorers</option>
          <option ${s.class_group==='Builders'?'selected':''}>Builders</option>
          <option ${s.class_group==='Navigators'?'selected':''}>Navigators</option>
        </select>`)}
      ${field('Gender', studIntake.gender, `
        <select class="detail-input" id="f-gender">
          <option value="" ${!studIntake.gender?'selected':''}>— Select —</option>
          <option ${studIntake.gender==='Male'?'selected':''}>Male</option>
          <option ${studIntake.gender==='Female'?'selected':''}>Female</option>
        </select>`)}
      ${field('Nationality', studIntake.nationality, `<input class="detail-input" id="f-nationality" value="${studIntake.nationality || ''}">`)}
      ${field('First language', studIntake.first_language, `<input class="detail-input" id="f-first-language" value="${studIntake.first_language || ''}">`)}
      ${field('Other languages', studIntake.other_languages, `<input class="detail-input" id="f-other-languages" value="${studIntake.other_languages || ''}">`)}
      ${field('Current school', studIntake.current_school, `<input class="detail-input" id="f-current-school" value="${studIntake.current_school || ''}">`)}
      ${field('Previous school', studIntake.previous_school, `<input class="detail-input" id="f-previous-school" value="${studIntake.previous_school || ''}">`)}
      ${field('Health / learning notes', studIntake.health_learning_notes, `<input class="detail-input" id="f-health-notes" value="${studIntake.health_learning_notes || ''}">`)}
    </div>

    <div class="detail-section">
      <h3>Parent / family contact</h3>
      ${field('Family name', fam.family_name, `<input class="detail-input" id="f-family-name" value="${fam.family_name || ''}">`)}
      ${field('Email', fam.contact_email, `<input class="detail-input" id="f-email" value="${fam.contact_email || ''}">`)}
      ${field('Phone', fam.contact_phone, `<input class="detail-input" id="f-phone" value="${fam.contact_phone || ''}">`)}
      ${field('Preferred contact', famIntake.preferred_contact, `
        <select class="detail-input" id="f-preferred-contact">
          <option value="" ${!famIntake.preferred_contact?'selected':''}>— Select —</option>
          <option ${famIntake.preferred_contact==='Line'?'selected':''}>Line</option>
          <option ${famIntake.preferred_contact==='WhatsApp'?'selected':''}>WhatsApp</option>
          <option ${famIntake.preferred_contact==='WeChat'?'selected':''}>WeChat</option>
          <option ${famIntake.preferred_contact==='Email'?'selected':''}>Email</option>
        </select>`)}
      ${field('Line / WeChat ID', famIntake.line_wechat_id, `<input class="detail-input" id="f-line-wechat" value="${famIntake.line_wechat_id || ''}">`)}
    </div>

    <div class="detail-section">
      <h3>Emergency contact</h3>
      ${field('Name', famIntake.emergency_name, `<input class="detail-input" id="f-emergency-name" value="${famIntake.emergency_name || ''}">`)}
      ${field('Relationship', famIntake.emergency_relationship, `<input class="detail-input" id="f-emergency-relationship" value="${famIntake.emergency_relationship || ''}">`)}
      ${field('Number', ((famIntake.emergency_country_code || '') + ' ' + (famIntake.emergency_number || '')).trim(), `<input class="detail-input" id="f-emergency-number" value="${(famIntake.emergency_country_code || '') + ' ' + (famIntake.emergency_number || '')}">`)}
    </div>

    <div class="detail-section">
      <h3>Interest &amp; learning hopes</h3>
      ${field('What interests them', famIntake.bcm_interest, `<input class="detail-input" id="f-bcm-interest" value="${famIntake.bcm_interest || ''}">`)}
      ${field('More on interest', famIntake.bcm_interest_more, `<input class="detail-input" id="f-bcm-interest-more" value="${famIntake.bcm_interest_more || ''}">`)}
      ${field('Learning hopes', famIntake.learning_hopes, `<input class="detail-input" id="f-learning-hopes" value="${famIntake.learning_hopes || ''}">`)}
      ${field('More on learning hopes', famIntake.learning_hopes_more, `<input class="detail-input" id="f-learning-hopes-more" value="${famIntake.learning_hopes_more || ''}">`)}
      ${field('Photo permission', famIntake.photo_permission, `
        <select class="detail-input" id="f-photo-permission">
          <option value="" ${!famIntake.photo_permission?'selected':''}>— Select —</option>
          <option ${famIntake.photo_permission==='Yes'?'selected':''}>Yes</option>
          <option ${famIntake.photo_permission==='No'?'selected':''}>No</option>
        </select>`)}
      ${field('Additional notes', famIntake.additional_notes, `<input class="detail-input" id="f-additional-notes" value="${famIntake.additional_notes || ''}">`)}
    </div>

    <div class="modal-save-bar">
      ${editMode
        ? `<button class="btn-small-outline" onclick="renderModal('${s.id}', false)">Cancel</button>
           <button class="btn-primary" onclick="saveModal('${s.id}')">Save changes</button>`
        : `<button class="btn-small-outline" onclick="closeModal()">Close</button>
           <button class="btn-primary" onclick="renderModal('${s.id}', true)">Edit</button>`
      }
    </div>
  `;
  document.getElementById('detailModal').classList.add('open');
}

async function saveModal(studentId){
  const s = allData.find(x => x.id === studentId);
  if(!s) return;
  const v = id => document.getElementById(id).value.trim();

  const studentUpdate = {
    first_name: v('f-first-name'),
    last_name: v('f-last-name'),
    date_of_birth: v('f-dob') || null,
    class_group: v('f-class-group') || null,
    staff_notes: v('f-staff-notes') || null,
    intake_data: {
      gender: v('f-gender') || null,
      nationality: v('f-nationality') || null,
      first_language: v('f-first-language') || null,
      other_languages: v('f-other-languages') || null,
      current_school: v('f-current-school') || null,
      previous_school: v('f-previous-school') || null,
      health_learning_notes: v('f-health-notes') || null
    }
  };

  const familyUpdate = {
    family_name: v('f-family-name'),
    contact_email: v('f-email') || null,
    contact_phone: v('f-phone') || null,
    intake_data: {
      preferred_contact: v('f-preferred-contact') || null,
      line_wechat_id: v('f-line-wechat') || null,
      emergency_name: v('f-emergency-name') || null,
      emergency_relationship: v('f-emergency-relationship') || null,
      emergency_number: v('f-emergency-number') || null,
      bcm_interest: v('f-bcm-interest') || null,
      bcm_interest_more: v('f-bcm-interest-more') || null,
      learning_hopes: v('f-learning-hopes') || null,
      learning_hopes_more: v('f-learning-hopes-more') || null,
      photo_permission: v('f-photo-permission') || null,
      additional_notes: v('f-additional-notes') || null
    }
  };

  const { error: studErr } = await sb.from('students').update(studentUpdate).eq('id', studentId);
  if(studErr){ showToast('Error saving learner: ' + studErr.message); return; }

  if(s.family_id){
    const { error: famErr } = await sb.from('families').update(familyUpdate).eq('id', s.family_id);
    if(famErr){ showToast('Error saving family: ' + famErr.message); return; }
  }

  showToast('Changes saved');
  closeModal();
  loadStudents();
}

function closeModal(){
  document.getElementById('detailModal').classList.remove('open');
}

async function createStudent(){
  const firstName = document.getElementById('firstName').value.trim();
  const lastName = document.getElementById('lastName').value.trim();
  const dob = document.getElementById('dob').value;
  const gender = document.getElementById('gender').value;
  const classGroup = document.getElementById('classGroup').value;
  const status = document.getElementById('status').value;
  const nationality = document.getElementById('nationality').value.trim();
  const firstLanguage = document.getElementById('firstLanguage').value.trim();
  const otherLanguages = document.getElementById('otherLanguages').value.trim();
  const currentSchool = document.getElementById('currentSchool').value.trim();
  const previousSchool = document.getElementById('previousSchool').value.trim();
  const healthNotes = document.getElementById('healthNotes').value.trim();

  const familyName = document.getElementById('familyName').value.trim();
  const familyEmail = document.getElementById('familyEmail').value.trim();
  const familyPhone = document.getElementById('familyPhone').value.trim();
  const preferredContact = document.getElementById('preferredContact').value;
  const lineWechatId = document.getElementById('lineWechatId').value.trim();
  const emergencyName = document.getElementById('emergencyName').value.trim();
  const emergencyRelationship = document.getElementById('emergencyRelationship').value.trim();
  const emergencyNumber = document.getElementById('emergencyNumber').value.trim();

  const msgEl = document.getElementById('createMsg');
  msgEl.style.color = '#5F5E5A';
  msgEl.textContent = '';

  if(!firstName || !lastName || !familyName){
    msgEl.style.color = '#B23A3A';
    msgEl.textContent = 'First name, last name, and family name are required.';
    return;
  }

  msgEl.textContent = 'Saving…';

  let familyId = null;
  const { data: existingFamily } = await sb.from('families').select('id').eq('family_name', familyName).maybeSingle();
  if(existingFamily){
    familyId = existingFamily.id;
    // update contact/intake info on the existing family record
    await sb.from('families').update({
      contact_email: familyEmail || null,
      contact_phone: familyPhone || null,
      intake_data: {
        preferred_contact: preferredContact || null,
        line_wechat_id: lineWechatId || null,
        emergency_name: emergencyName || null,
        emergency_relationship: emergencyRelationship || null,
        emergency_number: emergencyNumber || null
      }
    }).eq('id', familyId);
  } else {
    const { data: newFamily, error: famErr } = await sb.from('families').insert({
      family_name: familyName,
      contact_email: familyEmail || null,
      contact_phone: familyPhone || null,
      intake_data: {
        preferred_contact: preferredContact || null,
        line_wechat_id: lineWechatId || null,
        emergency_name: emergencyName || null,
        emergency_relationship: emergencyRelationship || null,
        emergency_number: emergencyNumber || null
      }
    }).select('id').single();
    if(famErr){ msgEl.style.color = '#B23A3A'; msgEl.textContent = famErr.message; return; }
    familyId = newFamily.id;
  }

  const { data: allStudents } = await sb.from('students').select('student_id_code');
  const code = nextStudentIdCode((allStudents||[]).map(s=>s.student_id_code));

  const { error: studErr } = await sb.from('students').insert({
    family_id: familyId,
    student_id_code: code,
    first_name: firstName,
    last_name: lastName,
    date_of_birth: dob || null,
    class_group: classGroup || null,
    status: status,
    intake_data: {
      gender: gender || null,
      nationality: nationality || null,
      first_language: firstLanguage || null,
      other_languages: otherLanguages || null,
      current_school: currentSchool || null,
      previous_school: previousSchool || null,
      health_learning_notes: healthNotes || null
    }
  });

  if(studErr){ msgEl.style.color = '#B23A3A'; msgEl.textContent = studErr.message; return; }

  msgEl.style.color = '#2E7D46';
  msgEl.textContent = `Added ${firstName} ${lastName} as ${code}.`;

  document.querySelectorAll('#firstName, #lastName, #dob, #nationality, #firstLanguage, #otherLanguages, #currentSchool, #previousSchool, #healthNotes, #familyName, #familyEmail, #familyPhone, #lineWechatId, #emergencyName, #emergencyRelationship, #emergencyNumber')
    .forEach(el => el.value = '');
  document.getElementById('gender').value = '';
  document.getElementById('classGroup').value = '';
  document.getElementById('preferredContact').value = '';

  loadStudents();
}

checkStaffAndInit();
</script>
