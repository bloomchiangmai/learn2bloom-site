<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Marketing HQ — Bloom Chiangmai</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="staff-shared.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#FDFAF5;color:#2C2C2A;width:100%;font-size:14px;line-height:1.5;}
button,input,select,textarea{font:inherit;color:inherit;}
a{color:#534AB7;}

main{max-width:1180px;margin:0 auto;padding:48px 32px 100px;min-height:70vh;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;color:#534AB7;text-transform:uppercase;margin-bottom:14px;}
h1{font-family:Georgia,serif;font-size:32px;font-weight:700;color:#2C2C2A;margin-bottom:8px;}
.sub{font-size:15px;color:#5F5E5A;max-width:680px;}
.top-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap;}

/* main tabs */
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;border-bottom:1px solid #E8E3D8;margin-bottom:28px;}
.tab{background:none;border:0;padding:10px 12px;font-size:15px;font-weight:600;color:#5F5E5A;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tab:hover{color:#2C2C2A;}
.tab.on{color:#534AB7;border-bottom-color:#534AB7;}
.tab .n{font-weight:400;color:#A8A39A;font-size:12px;margin-left:4px;}
.tab-sep{width:1px;height:20px;background:#E8E3D8;margin:0 8px;}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:-12px 0 24px;}
.pill{background:#fff;border:1px solid #DCD5C6;border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600;color:#5F5E5A;cursor:pointer;white-space:nowrap;}
.pill:hover{border-color:#888780;}
.pill.on{background:#534AB7;border-color:#534AB7;color:#fff;}
.pill .n{font-weight:400;opacity:.7;margin-left:3px;}

.btn-primary{padding:10px 20px;border:none;border-radius:8px;background:#534AB7;color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn-primary:hover{background:#443c99;}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;}
.btn-outline{padding:9px 16px;border:1px solid #DCD5C6;border-radius:8px;background:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.btn-outline:hover{border-color:#888780;}
.btn-danger{padding:9px 16px;border:1px solid #EBC3B4;border-radius:8px;background:#fff;color:#A23F1C;font-size:14px;font-weight:600;cursor:pointer;}
.link-btn{background:none;border:0;color:#534AB7;font-weight:600;font-size:13px;cursor:pointer;padding:0;}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.tools input,.tools select{border:1px solid #DCD5C6;background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;}
.tools input{min-width:240px;}
.tools .count{color:#888780;font-size:12px;}

.card{background:#F7F3EC;border:1px solid #E8E3D8;border-radius:12px;padding:22px 24px;}
.card h2{font-family:Georgia,serif;font-size:19px;font-weight:700;color:#2C2C2A;display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.card .why{color:#888780;font-size:13px;margin:2px 0 14px;}

/* table */
.tbl{background:#fff;border:1px solid #E8E3D8;border-radius:12px;overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;padding:10px 12px;border-bottom:2px solid #E8E3D8;color:#5F5E5A;font-size:12px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;background:#FCFBF8;}
td{padding:10px 12px;border-bottom:1px solid #E8E3D8;vertical-align:top;}
tr:last-child td{border-bottom:0;}
tbody tr{cursor:pointer;} tbody tr:hover td{background:#FBF9F4;}
td.main{font-weight:600;min-width:200px;}
td.nowrap{white-space:nowrap;}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#5F5E5A;max-width:340px;}
.muted{color:#888780;}

/* chips */
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#F1EFE8;color:#5F5E5A;white-space:nowrap;}
.chip.plum{background:#EEEDFE;color:#534AB7;} .chip.amber{background:#FDF1DF;color:#9A5D0C;}
.chip.rust{background:#FBE9E2;color:#A23F1C;} .chip.leaf{background:#E3F1EC;color:#0F6E56;}
.chip.blue{background:#E6F0FA;color:#1F5E99;}
.fmt{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#888780;border:1px solid #DCD5C6;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;}
.ready{display:inline-flex;gap:4px;}
.ready span{font-size:10.5px;font-weight:700;letter-spacing:.3px;border-radius:4px;padding:1px 5px;border:1px solid #DCD5C6;color:#B5B0A8;}
.ready span.ok{background:#E3F1EC;border-color:#E3F1EC;color:#0F6E56;}

/* pipeline strip */
.pipe{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:18px;}
.pipe button{background:#fff;border:1px solid #E8E3D8;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;}
.pipe button:hover{border-color:#DCD5C6;}
.pipe button.on{border-color:#534AB7;box-shadow:0 0 0 1px #534AB7;}
.pipe .num{font-family:Georgia,serif;font-size:22px;font-weight:700;line-height:1.1;}
.pipe .lbl{font-size:12px;color:#5F5E5A;}

/* reference cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.entry{background:#fff;border:1px solid #E8E3D8;border-radius:12px;padding:18px 20px;cursor:pointer;}
.entry:hover{border-color:#DCD5C6;}
.entry h3{font-family:Georgia,serif;font-weight:700;font-size:17px;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.kv{margin-top:8px;}
.kv b{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#888780;font-weight:700;}
.kv span{white-space:pre-wrap;}

/* overview */
.ov{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.ov .wide{grid-column:1/-1;}
.goal{background:#2C2C2A;color:#F7F3EC;border-radius:12px;padding:20px 24px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:20px;align-items:start;}
.goal .lbl{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#B5B0A8;margin-bottom:4px;font-weight:700;}
.goal .big{font-family:Georgia,serif;font-size:20px;line-height:1.3;}
.goal .val{font-size:15px;font-weight:600;}
.goal .edit{color:#F5C842;font-size:12px;cursor:pointer;background:none;border:0;padding:0;margin-top:8px;text-decoration:underline;}
.month-line{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.list{list-style:none;}
.list li{padding:9px 0;border-bottom:1px solid #E8E3D8;display:flex;justify-content:space-between;gap:12px;cursor:pointer;align-items:baseline;}
.list li:last-child{border-bottom:0;}
.list .t{font-weight:600;}
.list .s{color:#888780;font-size:12px;text-align:right;white-space:nowrap;}
.empty-state{color:#888780;font-size:14px;padding:22px;text-align:center;border:1px dashed #DCD5C6;border-radius:12px;background:#FCFBF8;}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(44,44,42,.28);display:none;z-index:80;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#FDFAF5;border-left:1px solid #E8E3D8;z-index:81;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;}
.drawer.wide{width:min(980px,100%);}
.dw-open .scrim{display:block;} .dw-open .drawer{transform:none;}
.drawer header{padding:18px 22px;border-bottom:1px solid #E8E3D8;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.drawer header h3{font-family:Georgia,serif;font-size:19px;font-weight:700;}
.drawer .body{padding:18px 22px;overflow:auto;flex:1;}
.drawer footer{padding:14px 22px;border-top:1px solid #E8E3D8;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;}
.f{margin-bottom:14px;}
.f label{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#888780;font-weight:700;margin-bottom:5px;}
.f label .hint{text-transform:none;letter-spacing:0;font-weight:400;color:#A8A39A;}
.f input,.f select,.f textarea{width:100%;border:1px solid #DCD5C6;background:#fff;border-radius:8px;padding:9px 11px;font-size:14px;}
.f textarea{min-height:90px;resize:vertical;line-height:1.5;}
.f textarea.tall{min-height:260px;}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid #EEEDFE;border-color:#534AB7;}
.grid-meta{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1.3fr;gap:10px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.sec-label{font-family:Georgia,serif;font-size:15px;font-weight:700;margin:6px 0 10px;padding-top:12px;border-top:1px solid #E8E3D8;}
details.orig{margin-bottom:14px;}
details.orig summary{cursor:pointer;font-size:13px;font-weight:600;color:#534AB7;margin-bottom:8px;}
.f .openl{font-size:12px;margin-top:4px;display:inline-block;}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:#888780;}
.confirm{display:none;gap:8px;align-items:center;font-size:13px;color:#A23F1C;}
.meta{color:#888780;font-size:12px;}
.toast{position:fixed;bottom:24px;right:24px;background:#2C2C2A;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;display:none;z-index:99;}

@media (max-width: 860px){
  main{padding:28px 16px 80px;}
  .goal{grid-template-columns:1fr 1fr;} .goal>div:first-child{grid-column:span 2;}
  .ov{grid-template-columns:1fr;}
  .pipe{grid-template-columns:repeat(4,1fr);}
  .grid-meta{grid-template-columns:1fr 1fr;} .grid-meta .f:first-child{grid-column:span 2;}
  .grid-2{grid-template-columns:1fr;}
  .tools input{min-width:0;flex:1;}
  .hide-m{display:none;}
}
</style>
</head>
<body>

<main class="page-content">
  <div id="authLoading" style="text-align:center;padding:80px 20px;color:#888780;font-size:14px;">Loading…</div>

  <div id="pageContent" style="display:none;">
    <div class="top-bar">
      <div>
        <div class="eyebrow">Tools</div>
        <h1>Marketing HQ</h1>
        <p class="sub">What we post, what we say about Bloom, and what needs doing next.</p>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div id="subtabs"></div>
    <div id="view"></div>
  </div>

<footer style="background:#F7F3EC;padding:22px 48px 40px;border-top:1px solid #E8E3D8;margin-top:60px;">
  <p style="text-align:center;font-size:12px;color:#888780;">© 2026 Bloom Chiangmai Learning Hub. All rights reserved.</p>
</footer>
</main>

<div id="dw"><div class="scrim" id="scrim"></div><div class="drawer" id="drawer"></div></div>
<div class="toast" id="toast"></div>

<script>
// ---------- Content plan definitions ----------
const STAGES = ['Draft','In review','Revised','Thai done','Scheduled','Posted','Skipped'];
const STAGE_HINT = {
  'Draft':'Written, not reviewed yet','In review':'With Michel','Revised':'Review done, needs Thai',
  'Thai done':'Ready to schedule','Scheduled':'Queued to post','Posted':'Live','Skipped':'Not going out'
};
const FORMATS = ['Post','Reel','Story','Video'];
const CHANNELS = ['Facebook Page','Instagram','Facebook + Instagram','Redbook','LINE','WeChat','Facebook groups'];
const CONTENT_FIELDS = ['title','date','time','format','channel','status','original','copy','review_note','th','hashtags','image','post_url','notes','source'];

// ---------- Reference sections ----------
const AUD = ['Expat English','Thai','Chinese','Alt-ed / homeschool','Mixed','All'];
const REF = [
 {k:'facts',t:'Info bank',view:'cards',d:'The true facts about Bloom. Every post should match these.',title:'label',chip:'status',
  f:[['label','Fact','text'],['category','Category','select',['Identity','Programmes','Fees','Dates','Location','Proof points','Contact','Positioning']],['value','Detail','long'],['status','Status','select',['Confirmed','To confirm','Outdated']],['source','Source','text']]},
 {k:'audiences',t:'Audiences',view:'cards',d:'Who we talk to, what they worry about, and what we say to them.',title:'name',chip:'priority',
  f:[['name','Segment','text'],['priority','Priority','select',['Primary','Secondary','Watch']],['who','Who they are','long'],['worries','What they worry about','long'],['message','Our message to them','long'],['channels','Where they are','text'],['language','Language','text']]},
 {k:'channels',t:'Channels',view:'cards',d:'Every account Bloom owns, and how each one gets fed.',title:'name',chip:'status',
  f:[['name','Channel','text'],['type','Type','select',['Social','Messaging','Website','Email']],['handle','Handle or link','text'],['automation','How it is fed','select',['Buffer (automated)','Manual','Own app','Not set up']],['status','Status','select',['Active','To confirm','To create','Paused']],['audience','Main audience','text'],['notes','Notes','long']]},
 {k:'groups',t:'Groups',view:'table',d:'Places where families already gather. Check the rules before posting.',title:'name',chip:'status',cols:['platform','audience','members','promo','status','last_posted'],
  f:[['name','Group','text'],['platform','Platform','select',['Facebook group','Redbook','WeChat group','LINE group','Forum','Other']],['url','Link','url'],['audience','Audience','select',AUD.slice(0,5)],['members','Members','text'],['promo','Promotion allowed','select',['Unknown','Yes','Specific days only','Admin approval','No']],['status','Status','select',['To verify','Joined','Pending approval','Active','Avoid']],['last_posted','Last posted','date'],['angle','Best angle','long'],['rules','Rules','long'],['notes','Notes','long']]},
 {k:'competitors',t:'Competitors',view:'table',d:'Who families compare us with, and where we differ.',title:'name',chip:'type',cols:['type','curriculum','fees','area'],
  f:[['name','School','text'],['type','Type','select',['International school','Alt-ed / hub','Bilingual','Chinese-focused','Homeschool co-op']],['curriculum','Curriculum','text'],['fees','Fees (per year)','text'],['area','Area','text'],['positioning','How they position','long'],['vs_bcm','Where Bloom differs','long'],['url','Link','url']]},
 {k:'insights',t:'Research notes',view:'cards',d:'Findings worth acting on, with where they came from.',title:'title',chip:'audience',
  f:[['title','Finding','text'],['audience','Audience','select',['Expat English','Thai','Chinese','Alt-ed / homeschool','All']],['finding','What we found','long'],['implication','What it means for Bloom','long'],['source','Source','url'],['date','Date','date']]},
];
const TASKS = {k:'tasks',t:'Tasks',view:'table',d:'What has to happen next, and who owns it.',title:'title',chip:'status',cols:['owner','due','status'],sort:'due',
  f:[['title','Task','text'],['owner','Owner','text'],['due','Due','date'],['status','Status','select',['To do','Doing','Waiting','Done']],['notes','Notes','long']]};
const SEC = Object.fromEntries([...REF, TASKS].map(s=>[s.k,s]));
const PLAN_FIELDS = [['goal','Goal','long'],['deadline','Deadline','date'],['budget','Ad budget per month','text'],['measure','How we measure success','text']];

let DATA = {}, PLAN = null, STAFF_NAMES = {}, loaded = false;
let canEdit = false, canDelete = false;
const filt = {q:'', s:''};
let month = null, stageFilter = '', refKey = 'facts';
const $ = (s,el=document)=>el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = v => /^https?:\/\//i.test(String(v||'')) ? v : '';
const tone = v => { v=String(v||'');
  if(/^(Confirmed|Active|Posted|Done|Yes|Primary|Buffer)/.test(v)) return 'leaf';
  if(/^(Scheduled|Thai done)/.test(v)) return 'blue';
  if(/^(To confirm|To verify|Pending|Waiting|In review|Revised|Specific|Admin|Secondary|Doing|Joined)/.test(v)) return 'amber';
  if(/^(Outdated|Avoid|No$|To create|Not set|Skipped)/.test(v)) return 'rust';
  if(/^(Draft|To do|Unknown|Watch)/.test(v)) return '';
  return 'plum'; };
const chip = v => v ? `<span class="chip ${tone(v)}">${esc(v)}</span>` : '';
const fmtDate = v => { if(!v) return ''; const d=new Date(v+'T00:00:00'); return isNaN(d)?esc(v):d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); };
const fmtDay = v => { if(!v) return ''; const d=new Date(v+'T00:00:00'); return isNaN(d)?esc(v):d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); };
const monthKey = v => v ? String(v).slice(0,7) : 'undated';
const monthLabel = k => k==='undated' ? 'No date yet' : new Date(k+'-01T00:00:00').toLocaleDateString('en-GB',{month:'short',year:'numeric'});
const thisMonth = () => new Date().toISOString().slice(0,7);
const view = () => { const h=location.hash.slice(1); return ['overview','content','tasks','ref'].includes(h) ? h : 'overview'; };
const go = k => { location.hash = k; };

// ---------- Data ----------
async function loadAll(){
  const [{ data, error }, { data: staff }] = await Promise.all([
    sb.from('marketing_entries').select('id,collection,data,updated_at,updated_by').order('created_at'),
    sb.from('staff').select('id,name')
  ]);
  if(error){ showToast('Could not load marketing data: ' + error.message); return; }
  STAFF_NAMES = Object.fromEntries((staff||[]).map(s=>[s.id, s.name]));
  DATA = {}; PLAN = null;
  (data||[]).forEach(r => {
    const row = { id:r.id, ...r.data, _updated:r.updated_at, _by:r.updated_by };
    if(r.collection === 'plan') PLAN = row;
    else (DATA[r.collection] = DATA[r.collection] || []).push(row);
  });
  loaded = true;
  render();
}

// ---------- Tabs ----------
function tabs(){
  const cur = view();
  const n = k => (DATA[k]||[]).length;
  $('#tabs').innerHTML = `
    <button class="tab ${cur==='overview'?'on':''}" onclick="go('overview')">Summary</button>
    <button class="tab ${cur==='content'?'on':''}" onclick="go('content')">Content plan<span class="n">${n('content')}</span></button>
    <button class="tab ${cur==='tasks'?'on':''}" onclick="go('tasks')">Tasks<span class="n">${(DATA.tasks||[]).filter(t=>t.status!=='Done').length}</span></button>
    <span class="tab-sep"></span>
    <button class="tab ${cur==='ref'?'on':''}" onclick="go('ref')">Reference</button>`;
  $('#subtabs').innerHTML = cur==='ref'
    ? `<div class="subtabs">${REF.map(s=>`<button class="pill ${s.k===refKey?'on':''}" onclick="refKey='${s.k}';filt.q='';filt.s='';render()">${s.t}<span class="n">${n(s.k)}</span></button>`).join('')}</div>` : '';
}

function render(){
  tabs();
  const el = $('#view'), v = view();
  if(!loaded){ el.innerHTML = '<div class="empty-state">Loading…</div>'; return; }
  if(v==='overview') el.innerHTML = overview();
  else if(v==='content') renderContent(el);
  else if(v==='tasks') renderList(el, TASKS);
  else renderList(el, SEC[refKey]);
}

// ---------- Summary ----------
function overview(){
  const P = PLAN || {}; const c = DATA.content||[], t = DATA.tasks||[], f = DATA.facts||[], ch = DATA.channels||[];
  const m = thisMonth(), today = new Date().toISOString().slice(0,10);
  const inMonth = c.filter(x=>monthKey(x.date)===m);
  const upcoming = c.filter(x=>x.date && x.date>=today && x.status!=='Posted' && x.status!=='Skipped').sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,6);
  const stuck = c.filter(x=>['In review','Revised','Thai done'].includes(x.status));
  const decisions = [...f.filter(x=>x.status==='To confirm').map(x=>({t:x.label,k:'facts',id:x.id})),
                     ...ch.filter(x=>x.status==='To confirm'||x.status==='To create').map(x=>({t:x.name+': '+String(x.status).toLowerCase(),k:'channels',id:x.id}))];
  const open = t.filter(x=>x.status!=='Done').sort((a,b)=>String(a.due||'9').localeCompare(String(b.due||'9'))).slice(0,6);
  const list = (items, empty) => items.length ? `<ul class="list">${items.join('')}</ul>` : `<div class="empty-state">${empty}</div>`;
  const counts = STAGES.filter(s=>s!=='Skipped').map(s=>[s, inMonth.filter(x=>(x.status||'Draft')===s).length]).filter(x=>x[1]);
  return `<div class="ov">
   <div class="goal wide">
     <div><div class="lbl">Goal</div><div class="big">${esc(P.goal||'Not set yet')}</div>
       ${canEdit?`<button class="edit" onclick="editPlan()">Edit goal, deadline and budget</button>`:''}</div>
     <div><div class="lbl">Deadline</div><div class="val">${P.deadline?fmtDate(P.deadline):'Not set'}</div></div>
     <div><div class="lbl">Ad budget / month</div><div class="val">${esc(P.budget||'Not set')}</div></div>
     <div><div class="lbl">Success measure</div><div class="val">${esc(P.measure||'Not set')}</div></div>
   </div>

   <div class="card wide">
     <h2>Posts this month <button class="link-btn" onclick="month='${m}';stageFilter='';go('content')">Open ${monthLabel(m)}</button></h2>
     <p class="why">${inMonth.length} ${inMonth.length===1?'post':'posts'} planned for ${monthLabel(m)}${stuck.length?`, ${stuck.length} in progress across all months`:''}.</p>
     ${counts.length?`<div class="month-line">${counts.map(([s,n])=>`<span class="chip ${tone(s)}">${n} ${esc(s.toLowerCase())}</span>`).join('')}</div>`:''}
     ${list(upcoming.map(x=>`<li onclick="editContent('${x.id}')"><span class="t">${esc(x.title)}${x.format&&x.format!=='Post'?`<span class="fmt">${esc(x.format)}</span>`:''}</span><span class="s">${fmtDay(x.date)}${x.time?' · '+esc(x.time):''} · ${esc(x.status||'Draft')}</span></li>`), 'Nothing dated from today onward. Pick drafts from "No date yet" in the Content plan and give them a date.')}
   </div>

   <div class="card">
     <h2>Waiting on a decision <button class="link-btn" onclick="refKey='facts';go('ref')">Info bank</button></h2>
     <p class="why">Facts we cannot post about until someone confirms them.</p>
     ${list(decisions.slice(0,8).map(x=>`<li onclick="editRef('${x.k}','${x.id}')"><span class="t">${esc(x.t)}</span></li>`), 'Nothing waiting.')}
   </div>
   <div class="card">
     <h2>Open tasks <button class="link-btn" onclick="go('tasks')">All tasks</button></h2>
     <p class="why">Who needs to do what next.</p>
     ${list(open.map(x=>`<li onclick="editRef('tasks','${x.id}')"><span class="t">${esc(x.title)}</span><span class="s">${esc(x.owner||'')}${x.due?' · '+fmtDate(x.due):''}${x.due&&x.due<today?' · <b style="color:#A23F1C">overdue</b>':''}</span></li>`), 'No open tasks.')}
   </div>
  </div>`;
}

// ---------- Content plan ----------
function renderContent(el){
  const all = DATA.content || [];
  const keys = [...new Set(all.map(x=>monthKey(x.date)))].filter(k=>k!=='undated').sort();
  const cur = thisMonth();
  if(!keys.includes(cur)) keys.push(cur), keys.sort();
  if(!month) month = cur;
  const undated = all.filter(x=>!x.date).length;
  let rows = all.filter(x=>monthKey(x.date)===month);
  const monthRows = rows;
  if(stageFilter) rows = rows.filter(x=>(x.status||'Draft')===stageFilter);
  if(filt.q){ const q=filt.q.toLowerCase(); rows = rows.filter(x=>['title','copy','th','notes','review_note'].some(k=>String(x[k]||'').toLowerCase().includes(q))); }
  rows.sort((a,b)=>(String(a.date||'')+(a.time||'')).localeCompare(String(b.date||'')+(b.time||'')));
  const counts = Object.fromEntries(STAGES.map(s=>[s, monthRows.filter(x=>(x.status||'Draft')===s).length]));
  el.innerHTML = `
    <div class="top-bar" style="margin-bottom:14px;">
      <p class="sub">Every post from idea to published: English, Thai, image and the live link, month by month.</p>
      ${canEdit?`<button class="btn-primary" onclick="editContent()">Add post</button>`:''}
    </div>
    <div class="subtabs" style="margin:0 0 16px;">
      ${keys.map(k=>`<button class="pill ${k===month?'on':''}" onclick="month='${k}';stageFilter='';render()">${monthLabel(k)}<span class="n">${all.filter(x=>monthKey(x.date)===k).length}</span></button>`).join('')}
      <button class="pill ${month==='undated'?'on':''}" onclick="month='undated';stageFilter='';render()">No date yet<span class="n">${undated}</span></button>
    </div>
    <div class="pipe">${STAGES.map(s=>`<button class="${stageFilter===s?'on':''}" onclick="stageFilter=stageFilter==='${s}'?'':'${s}';render()" title="${esc(STAGE_HINT[s])}"><div class="num">${counts[s]}</div><div class="lbl">${s}</div></button>`).join('')}</div>
    <div class="tools">
      <input id="q" placeholder="Search posts" value="${esc(filt.q)}">
      ${stageFilter?`<button class="link-btn" onclick="stageFilter='';render()">Show all stages</button>`:''}
      <span class="count">${rows.length} of ${monthRows.length}</span>
    </div>
    ${!rows.length ? `<div class="empty-state">${monthRows.length?'Nothing matches.':'No posts in '+esc(monthLabel(month))+' yet.'}</div>` : `
    <div class="tbl"><table><thead><tr><th>Date</th><th class="hide-m">Time</th><th>Post</th><th class="hide-m">Channel</th><th>Stage</th><th>Ready</th><th></th></tr></thead><tbody>
    ${rows.map(x=>`<tr onclick="editContent('${x.id}')">
      <td class="nowrap">${x.date?fmtDay(x.date):'<span class="muted">No date</span>'}</td>
      <td class="nowrap hide-m muted">${esc(x.time||'')}</td>
      <td class="main">${esc(x.title)}${x.format&&x.format!=='Post'?`<span class="fmt">${esc(x.format)}</span>`:''}</td>
      <td class="nowrap hide-m muted">${esc(x.channel||'')}</td>
      <td>${chip(x.status||'Draft')}</td>
      <td><span class="ready"><span class="${x.copy?'ok':''}">EN</span><span class="${x.th?'ok':''}">TH</span><span class="${x.image?'ok':''}">IMG</span></span></td>
      <td>${safeUrl(x.post_url)?`<a href="${esc(x.post_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:12px;font-weight:600">View</a>`:''}</td>
    </tr>`).join('')}</tbody></table></div>`}`;
  const q = $('#q'); if(q) q.oninput = e => { filt.q = e.target.value; const p = e.target.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p,p); };
}

// ---------- Generic list (tasks + reference) ----------
function renderList(el, s){
  const all = DATA[s.k] || [];
  const rows = all.filter(r => {
    if(filt.s && r[s.chip] !== filt.s) return false;
    if(filt.q){ const q = filt.q.toLowerCase(); return s.f.some(f => String(r[f[0]]||'').toLowerCase().includes(q)); }
    return true; });
  if(s.sort) rows.sort((a,b)=>String(a[s.sort]||'9999').localeCompare(String(b[s.sort]||'9999')));
  const chipField = s.f.find(x=>x[0]===s.chip);
  const opts = chipField && chipField[3] ? chipField[3] : [];
  el.innerHTML = `
    <div class="top-bar" style="margin-bottom:16px;">
      <p class="sub">${esc(s.d)}</p>
      ${canEdit ? `<button class="btn-primary" onclick="editRef('${s.k}')">Add entry</button>` : ''}
    </div>
    <div class="tools">
      <input id="q" placeholder="Search ${esc(s.t.toLowerCase())}" value="${esc(filt.q)}">
      ${opts.length ? `<select id="sf"><option value="">All ${esc(chipField[1].toLowerCase())}</option>${opts.map(o=>`<option ${o===filt.s?'selected':''}>${esc(o)}</option>`).join('')}</select>` : ''}
      <span class="count">${rows.length} of ${all.length}</span>
    </div>
    ${!rows.length ? `<div class="empty-state">${all.length ? 'Nothing matches that filter.' : 'Nothing here yet.'}</div>`
      : s.view === 'table' ? table(s, rows) : cards(s, rows)}`;
  const q = $('#q'); if(q) q.oninput = e => { filt.q = e.target.value; const p = e.target.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p,p); };
  const sf = $('#sf'); if(sf) sf.onchange = e => { filt.s = e.target.value; render(); };
}
function label(s,key){ return (s.f.find(x=>x[0]===key)||[0,key])[1]; }
function cell(s,key,v){ const f = s.f.find(x=>x[0]===key); if(!f) return esc(v);
  if(f[2]==='date') return fmtDate(v); if(f[2]==='select') return chip(v); if(f[2]==='long') return `<span class="clip">${esc(v)}</span>`; return esc(v); }
function table(s,rows){
  return `<div class="tbl"><table><thead><tr><th>${label(s,s.title)}</th>${s.cols.map(c=>`<th>${label(s,c)}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(r=>`<tr onclick="editRef('${s.k}','${r.id}')"><td class="main">${esc(r[s.title])}${safeUrl(r.url)?` <a href="${esc(r.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-weight:400;font-size:12px">link</a>`:''}</td>
  ${s.cols.map(c=>`<td>${cell(s,c,r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function cards(s,rows){
  return `<div class="cards">${rows.map(r=>`<div class="entry" onclick="editRef('${s.k}','${r.id}')">
    <h3><span>${esc(r[s.title])}</span>${chip(r[s.chip])}</h3>
    ${s.f.filter(f=>f[0]!==s.title&&f[0]!==s.chip&&r[f[0]]).map(f => f[2]==='url' && safeUrl(r[f[0]])
      ? `<div class="kv"><b>${f[1]}</b><span><a href="${esc(r[f[0]])}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(String(r[f[0]]).replace(/^https?:\/\/(www\.)?/,'').slice(0,48))}</a></span></div>`
      : `<div class="kv"><b>${f[1]}</b><span>${f[2]==='date'?fmtDate(r[f[0]]):esc(r[f[0]])}</span></div>`).join('')}
  </div>`).join('')}</div>`;
}

// ---------- Drawer ----------
let cur = null, saving = false;
function closeD(){ $('#dw').classList.remove('dw-open'); cur = null; }
$('#scrim').onclick = closeD;
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeD(); });
function field(f, v, cls=''){ const [k,l,t,o,hint] = f; v = v ?? '';
  const inp = t==='long' ? `<textarea name="${k}" class="${cls}">${esc(v)}</textarea>`
    : t==='select' ? `<select name="${k}"><option value=""></option>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}${v&&!o.includes(v)?`<option selected>${esc(v)}</option>`:''}</select>`
    : `<input name="${k}" type="${t==='date'?'date':t==='url'?'url':t==='time'?'time':'text'}" value="${esc(v)}">`;
  const open = t==='url' && safeUrl(v) ? `<a class="openl" href="${esc(v)}" target="_blank" rel="noopener">Open</a>` : '';
  return `<div class="f"><label>${l}${hint?` <span class="hint">${hint}</span>`:''}</label>${inp}${open}</div>`; }
function metaLine(r){
  if(!r || !r._updated) return '';
  const who = r._by && STAFF_NAMES[r._by] ? ' by ' + esc(STAFF_NAMES[r._by]) : '';
  return `<div class="meta">Last updated ${new Date(r._updated).toLocaleString('en-GB')}${who}${r.source?' · '+esc(r.source):''}</div>`;
}
function drawerShell(title, body, id, wide){
  const ro = !canEdit;
  $('#drawer').className = 'drawer' + (wide ? ' wide' : '');
  $('#drawer').innerHTML = `<header><h3>${title}</h3><button class="x" onclick="closeD()">×</button></header>
    <form class="body" id="fm" onsubmit="return false">${body}</form>
    <footer><div>${id && canDelete ? `<button class="btn-danger" id="del">Delete</button><span class="confirm" id="cf">Delete this? <button class="btn-danger" id="yes">Yes, delete</button><button class="btn-outline" id="no">Keep</button></span>` : ''}</div>
    <div style="display:flex;gap:8px;align-items:center"><span id="msg" style="font-size:12px;color:#A23F1C"></span><button class="btn-outline" onclick="closeD()">${ro?'Close':'Cancel'}</button>${ro?'':'<button class="btn-primary" id="sv">Save</button>'}</div></footer>`;
  if(ro) $('#fm').querySelectorAll('input,select,textarea').forEach(e=>e.disabled=true);
  $('#dw').classList.add('dw-open');
  if($('#del')){
    $('#del').onclick = () => { $('#del').style.display='none'; $('#cf').style.display='flex'; };
    $('#no').onclick = () => { $('#del').style.display=''; $('#cf').style.display='none'; };
    $('#yes').onclick = async () => {
      const { error } = await sb.from('marketing_entries').delete().eq('id', id);
      if(error){ $('#msg').textContent = 'Could not delete: ' + error.message; return; }
      closeD(); showToast('Deleted.'); loadAll(); };
  }
}
function readForm(keys){
  const fd = new FormData($('#fm')); const body = {};
  keys.forEach(k => { const v = String(fd.get(k) ?? '').trim(); if(v) body[k] = v; });
  return body;
}
async function persist(collection, id, body){
  if(saving) return; saving = true; const b = $('#sv'); if(b) b.disabled = true;
  const { error } = id
    ? await sb.from('marketing_entries').update({ data: body }).eq('id', id)
    : await sb.from('marketing_entries').insert({ collection, data: body });
  saving = false; if($('#sv')) $('#sv').disabled = false;
  if(error){ $('#msg').textContent = 'Could not save: ' + error.message; return; }
  closeD(); showToast('Saved.'); loadAll();
}

// Content post editor (wide, mirrors the team's spreadsheet + review doc)
function editContent(id){
  const r = id ? (DATA.content||[]).find(x=>x.id===id) : { status:'Draft', format:'Post', channel:'Facebook Page', date: month && month!=='undated' ? '' : '' };
  if(id && !r) return;
  const body = `
    <div class="grid-meta">
      ${field(['title','Topic','text'], r.title)}
      ${field(['date','Date','date'], r.date)}
      ${field(['time','Time','time'], r.time)}
      ${field(['format','Format','select',FORMATS], r.format)}
      ${field(['status','Stage','select',STAGES], r.status)}
      ${field(['channel','Channel','select',CHANNELS], r.channel)}
    </div>
    <details class="orig" ${r.original?'open':''}><summary>Original draft${r.original?'':' (optional)'}</summary>
      ${field(['original','Original draft','long',null,'before review'], r.original)}
    </details>
    <div class="grid-2">
      ${field(['copy','English caption','long'], r.copy, 'tall')}
      ${field(['th','Thai caption','long'], r.th, 'tall')}
    </div>
    ${field(['review_note','Review note','long',null,'what Michel changed and why'], r.review_note)}
    <div class="sec-label">Assets and links</div>
    ${field(['hashtags','Hashtags','text'], r.hashtags)}
    <div class="grid-2">
      ${field(['image','Image or video link','url'], r.image)}
      ${field(['post_url','Published post link','url'], r.post_url)}
    </div>
    ${field(['notes','Notes','long'], r.notes)}
    <input type="hidden" name="source" value="${esc(r.source||'')}">
    ${metaLine(r)}`;
  cur = {content:true, id};
  drawerShell(id ? esc(r.title||'Post') : 'New post', body, id, true);
  if($('#sv')) $('#sv').onclick = () => {
    const data = readForm(CONTENT_FIELDS);
    if(!data.title){ $('#msg').textContent = 'Topic is required.'; return; }
    persist('content', id, data);
  };
}

// Reference / tasks editor
function editRef(k, id){
  const s = SEC[k]; const r = id ? (DATA[k]||[]).find(x=>x.id===id) : {}; if(id && !r) return;
  cur = {k, id};
  drawerShell(id ? esc(r[s.title]||'Entry') : 'New entry', s.f.map(f=>field(f, r[f[0]])).join('') + metaLine(r), id, false);
  if($('#sv')) $('#sv').onclick = () => {
    const data = readForm(s.f.map(f=>f[0]));
    if(!data[s.title]){ $('#msg').textContent = label(s, s.title) + ' is required.'; return; }
    persist(k, id, data);
  };
  setTimeout(()=>{ const first = $('#fm [name]'); if(first && !id && canEdit) first.focus(); }, 50);
}
function editPlan(){
  const P = PLAN || {}; cur = {plan:true};
  drawerShell('Goal and targets', PLAN_FIELDS.map(f=>field(f, P[f[0]])).join('') + metaLine(PLAN), null, false);
  if($('#sv')) $('#sv').onclick = () => persist('plan', PLAN && PLAN.id, readForm(PLAN_FIELDS.map(f=>f[0])));
}

// ---------- Boot ----------
async function onStaffReady(){
  if(!canAccess('marketing', 'view')){ window.location.href = 'staff-dashboard.html'; return; }
  canEdit = canAccess('marketing', 'edit');
  canDelete = canAccess('marketing', 'full');
  render();
  loadAll();
}
window.addEventListener('hashchange', () => { filt.q=''; filt.s=''; closeD(); render(); window.scrollTo(0,0); });
window.addEventListener('focus', () => { if(loaded && !cur) loadAll(); });

window.STAFF_PAGE_KEY = 'marketing';
checkStaffAndInit();
</script>
