<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard — Bloom Chiangmai</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- seo -->
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="staff-shared.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#FDFAF5;color:#2C2C2A;}
main{max-width:900px;margin:0 auto;padding:60px 32px 100px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;color:#534AB7;text-transform:uppercase;margin-bottom:14px;}
h1{font-family:Georgia,serif;font-size:32px;font-weight:700;margin-bottom:8px;}
.stat-row{margin-top:8px;}
.wbox{background:#fff;border:1px solid #E8E3D8;border-radius:14px;padding:6px 24px 10px;margin-bottom:24px;}
.wbox h2{font-family:Georgia,serif;font-size:21px;margin:16px 0 4px;}
.wl{display:flex;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid #EFEAE0;flex-wrap:wrap;}
.wl:last-child{border-bottom:0;}
.wtag{font-size:12px;font-weight:700;color:#3C3489;background:#EEEDFE;padding:4px 10px;border-radius:8px;min-width:104px;text-align:center;}
.wtxt{flex:1 1 240px;font-size:15px;}
.wtxt .late{color:#A32D2D;font-weight:600;}
.wbtn{font-size:14px;font-weight:600;text-decoration:none;padding:8px 14px;border:1px solid #CECBF6;border-radius:8px;color:#534AB7;background:#fff;cursor:pointer;font-family:inherit;}
.wbtn:hover{border-color:#534AB7;}
.quiet{font-size:15px;color:#5F5E5A;padding:14px 0 10px;}
.sublist{width:100%;padding:4px 0 0 120px;}
.sublist a{display:block;padding:8px 0;border-top:1px solid #F3EFE6;text-decoration:none;color:#2C2C2A;font-size:14px;}
@media (max-width:700px){.sublist{padding-left:0;}}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:16px;margin-bottom:40px;}
.stat-card{background:#F7F3EC;border:1px solid #E8E3D8;border-radius:12px;padding:20px;}
.stat-num{font-family:Georgia,serif;font-size:32px;font-weight:700;color:#534AB7;}
.stat-label{font-size:12px;color:#888780;text-transform:uppercase;letter-spacing:.4px;margin-top:4px;}


#authLoading{text-align:center;padding:80px 20px;color:#888780;font-size:14px;}
.toast{position:fixed;bottom:24px;right:24px;background:#2C2C2A;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;display:none;z-index:99;}
.btn-small-outline{padding:6px 12px;font-size:12px;border:1px solid #534AB7;border-radius:6px;background:#fff;color:#534AB7;cursor:pointer;font-weight:600;}
.btn-small-outline:hover{background:#f5f3ee;}

</style>
</head>
<body>

<div id="authLoading">Loading…</div>

<div id="pageContent" class="page-content" style="display:none;">
<main>
  <div class="eyebrow" id="today"></div>
  <h1 id="greeting">Welcome</h1>

  <div class="stat-row" id="statRow"></div>

  <section class="wbox" aria-labelledby="waitTitle">
    <h2 id="waitTitle">Waiting on you</h2>
    <div id="waitList"><p class="quiet">Loading…</p></div>
  </section>
</main>

<div class="toast" id="toast"></div>
</div>

<script>
window.STAFF_PAGE_KEY = 'dashboard';

// The home page answers one question: what needs me today?
// Each tool adds a line only when something needs this person. Open tools from the menu.
const escD = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let OPEN_SUB = null;

async function onStaffReady(staffRow){
  const now = new Date(), h = now.getHours();
  document.getElementById('today').textContent = now.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
  document.getElementById('greeting').textContent = `Good ${h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening'}, ${staffRow.name.split(' ')[0]}`;
  window._isAdminOrIt = window.currentStaffRole === 'admin' || window.currentStaffRole === 'director' || window.currentStaffRole === 'it';
  await loadHome();
  setInterval(loadHome, 30000);
}

// Each source returns { stats: [...], lines: [...] }. A line: { tag, html, href | onclick, btn, sub }
const SOURCES = [];

// Admissions and Learners: new enquiries and parent requests
SOURCES.push(async () => {
  if(!canAccess('students', 'view')) return null;
  const [{ count: active }, { data: enq }, { data: notes }] = await Promise.all([
    sb.from('students').select('*', { count: 'exact', head: true }).eq('status', 'enrolled'),
    sb.from('students').select('id, first_name, last_name, student_id_code').eq('status', 'enquiry'),
    sb.from('parent_notes').select('id, note, student_id, students(first_name, last_name, student_id_code)').eq('resolved', false).order('created_at', { ascending: false })
  ]);
  const e = enq || [], n = notes || [];
  const lines = [];
  if(e.length) lines.push({ tag:'Admissions', html:`${e.length} new enquir${e.length === 1 ? 'y' : 'ies'} to reply to`, href:'staff-admissions.html', btn:'Open',
    sub: e.map(x => `<a href="staff-admissions.html">${escD(x.first_name)} ${escD(x.last_name || '')}${x.student_id_code ? ` <span style="color:#888780;font-size:12px;">· ${escD(x.student_id_code)}</span>` : ''}</a>`).join('') });
  if(n.length) lines.push({ tag:'Learners', html:`${n.length} parent request${n.length === 1 ? '' : 's'}`, btn:'Show', subOnly:true,
    sub: n.map(x => { const st = x.students || {}; const link = st.student_id_code ? `learners.html?student=${encodeURIComponent(st.student_id_code)}` : 'learners.html';
      return `<a href="${link}"><b>${escD(st.first_name)} ${escD(st.last_name || '')}</b><br><span style="color:#5F5E5A;font-size:13px;">${escD(x.note)}</span></a>`; }).join('') });
  return { stats: [{ num: active ?? '—', label: 'Enrolled students', href: 'learners.html' }, { num: e.length, label: 'New enquiries', href: 'staff-admissions.html' }], lines };
});

// Approvals (admin and IT)
SOURCES.push(async () => {
  if(!window._isAdminOrIt) return null;
  const { count } = await sb.from('approval_requests').select('*', { count: 'exact', head: true }).eq('status', 'pending');
  const c = count || 0;
  return { stats: [{ num: c, label: 'Approvals waiting', href: 'staff-permissions.html#approvals' }],
    lines: c ? [{ tag:'Admin', html:`${c} approval${c === 1 ? '' : 's'} waiting for you`, href:'staff-permissions.html#approvals', btn:'Review' }] : [] };
});

// Calendar: changes this person asked for that are still waiting
SOURCES.push(async () => {
  if(!canAccess('calendar', 'view') || window._isAdminOrIt) return null;
  const { count } = await sb.from('approval_requests').select('*', { count: 'exact', head: true })
    .eq('status', 'pending').eq('module', 'calendar').eq('requested_by', window.currentStaff.id);
  const c = count || 0;
  return { stats: [], lines: c ? [{ tag:'Calendar', html:`${c} calendar change${c === 1 ? '' : 's'} you asked for ${c === 1 ? 'is' : 'are'} waiting for approval`, href:'staff-calendar.html', btn:'View' }] : [] };
});

// Marketing HQ: posts at this person's step, late ones, and posts not marked as posted
SOURCES.push(async () => {
  if(!canAccess('marketing', 'view')) return null;
  // Site features: no HQ lines while the HQ is switched off, except for admin, director and IT
  const { data: st } = await sb.from('bloom_settings').select('marketing_enabled').limit(1).maybeSingle();
  if(st && st.marketing_enabled === false && !['admin','director','it'].includes(window.currentStaff.role)) return null;
  const me = window.currentStaff.id;
  // Item 58: each post names its own writer, reviewer and translator.
  const { data: posts } = await sb.from('marketing_posts').select('id, title, step, pic, writer, translator, poster, post_date, sent_back').not('step', 'in', '("posted","cancelled")');
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = iso(new Date());
  const back = { english: 3, review: 2, thai: 1, post: 0 };
  const due = p => { if(!p.post_date || back[p.step] === undefined) return null; const d = new Date(p.post_date + 'T00:00:00'); d.setDate(d.getDate() - back[p.step]); return iso(d); };
  const mine = (posts || []).filter(p => (p.post_date || p.sent_back) && (
    (p.writer === me && p.step === 'english') ||
    ((p.poster || p.writer) === me && p.step === 'post') ||
    (p.translator === me && p.step === 'thai') ||
    (p.step === 'review' && p.pic === me)));
  const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  const word = { english:'Write the English for', review:'Review', thai:'Translate', post:'Post' };
  const lines = mine.sort((a, b) => String(due(a) || '9').localeCompare(String(due(b) || '9'))).slice(0, 5).map(p => {
    const d = due(p), late = d && d < today;
    return { tag:'Marketing HQ', href:`staff-marketing.html#post/${p.id}`, btn:'Open',
      html:`${p.sent_back ? 'Sent back: ' : (word[p.step] || '') + ' '}${escD(p.title)}${d ? (late ? ` <span class="late">(late, due ${fmt(d)})</span>` : ` <span style="color:#888780;">(due ${fmt(d)})</span>`) : ''}` };
  });
  if(mine.length > 5) lines.push({ tag:'Marketing HQ', html:`${mine.length - 5} more posts are your turn`, href:'staff-marketing.html#turn', btn:'See all' });
  // Item 86: people kept informed see how many posts were approved since they last cleared the list
  const { data: tm } = await sb.from('marketing_team').select('informed, fyi_read_at').eq('staff_id', me).maybeSingle();
  if(tm && tm.informed){
    const since = tm.fyi_read_at || new Date(Date.now() - 14*864e5).toISOString();
    const { data: ev } = await sb.from('marketing_post_events').select('post_id').like('kind', 'approved%').gt('created_at', since).neq('actor', me).limit(200);
    const open = new Set((posts || []).map(p => p.id));
    const n = new Set((ev || []).map(e => e.post_id).filter(id => open.has(id))).size;
    if(n) lines.push({ tag:'Marketing HQ', html:`${n} post${n === 1 ? ' was' : 's were'} approved, for your info`, href:'staff-marketing.html#turn', btn:'See' });
  }
  // The admin sees posts that are late at someone else's step
  if(window._isAdminOrIt && canAccess('marketing', 'full')){
    const lateOthers = (posts || []).filter(p => !mine.includes(p) && p.post_date && due(p) && due(p) < today);
    if(lateOthers.length) lines.push({ tag:'Marketing HQ', html:`${lateOthers.length} post${lateOthers.length === 1 ? ' is' : 's are'} late at someone else's step`, href:'staff-marketing.html#overview', btn:'Overview' });
  }
  return { stats: [], lines };
});

async function loadHome(){
  const results = (await Promise.all(SOURCES.map(fn => fn().catch(err => { console.log('dashboard source failed', err); return null; })))).filter(Boolean);
  const stats = results.flatMap(r => r.stats || []), lines = results.flatMap(r => r.lines || []);
  window._lines = lines;

  document.getElementById('statRow').innerHTML = stats.map(s => s.href
    ? `<a class="stat-card" href="${s.href}" style="text-decoration:none;color:inherit;"><div class="stat-num">${escD(s.num)}</div><div class="stat-label">${escD(s.label)}</div></a>`
    : `<div class="stat-card"><div class="stat-num">${escD(s.num)}</div><div class="stat-label">${escD(s.label)}</div></div>`).join('');
  document.getElementById('statRow').style.display = stats.length ? '' : 'none';

  document.getElementById('waitTitle').textContent = lines.length ? `Waiting on you: ${lines.length}` : 'Waiting on you';
  document.getElementById('waitList').innerHTML = lines.length
    ? lines.map((l, i) => `<div class="wl">
        <span class="wtag">${escD(l.tag)}</span>
        <span class="wtxt">${l.html}</span>
        ${l.subOnly ? `<button class="wbtn" onclick="toggleSub(${i})">${OPEN_SUB === i ? 'Hide' : l.btn}</button>` : `<a class="wbtn" href="${l.href}">${escD(l.btn)}</a>`}
        ${l.sub && l.subOnly && OPEN_SUB === i ? `<div class="sublist">${l.sub}</div>` : ''}
      </div>`).join('')
    : '<p class="quiet">Nothing needs you right now. Open any tool from the menu.</p>';
}
function toggleSub(i){ OPEN_SUB = OPEN_SUB === i ? null : i; loadHome(); }

checkStaffAndInit();
</script>

</body>
</html>
