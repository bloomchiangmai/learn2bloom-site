<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Team — Bloom Chiangmai</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="staff-shared.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#FDFAF5;color:#2C2C2A;width:100%;}
nav{display:flex;align-items:center;justify-content:space-between;padding:10px max(48px, calc((100% - 1200px) / 2 + 48px));background:#FDFAF5;border-bottom:1px solid #E8E3D8;}
.logo{font-family:Georgia,serif;font-size:22px;font-weight:700;color:#2C2C2A;text-decoration:none;}
.nav-tabs{display:flex;gap:8px;}
.nav-tab{font-size:13px;font-weight:600;padding:8px 16px;border-radius:8px;text-decoration:none;color:#5F5E5A;}
.nav-tab.active{background:#534AB7;color:#fff;}

main{max-width:900px;margin:0 auto;padding:60px 24px 100px;min-height:70vh;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;color:#534AB7;text-transform:uppercase;margin-bottom:14px;}
h1{font-family:Georgia,serif;font-size:32px;font-weight:700;color:#2C2C2A;margin-bottom:8px;}
.sub{font-size:15px;color:#5F5E5A;margin-bottom:40px;}

.login-box{max-width:420px;margin:80px auto;text-align:center;}
.login-box input{width:100%;padding:12px 14px;border:1px solid #E8E3D8;border-radius:8px;font-size:15px;margin-bottom:12px;background:#fff;}
.login-box button{width:100%;padding:12px;border:none;border-radius:8px;background:#534AB7;color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.login-box button:hover{background:#443c99;}
.error-msg{color:#B23A3A;font-size:13px;margin-top:10px;}

.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.signout-link{font-size:13px;color:#888780;cursor:pointer;text-decoration:underline;}

.directory-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));gap:16px;}
.person-card{background:#F7F3EC;border:1px solid #E8E3D8;border-radius:12px;padding:20px;cursor:pointer;transition:border-color .15s;}
.person-card:hover{border-color:#534AB7;}
.person-name{font-weight:700;font-size:16px;margin-bottom:2px;}
.person-role{font-size:12px;color:#534AB7;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;}
.person-detail{font-size:13px;color:#5F5E5A;margin-bottom:2px;}
.you-badge{display:inline-block;font-size:10px;font-weight:700;background:#534AB7;color:#fff;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:middle;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(44,44,42,0.5);z-index:100;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:#FDFAF5;border-radius:12px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;padding:32px;position:relative;}
.modal-close{position:absolute;top:20px;right:20px;background:none;border:none;font-size:20px;cursor:pointer;color:#888780;}
.modal-box h2{font-family:Georgia,serif;font-size:24px;margin-bottom:4px;}
.modal-box .modal-sub{font-size:13px;color:#888780;margin-bottom:24px;}
.detail-section{margin-bottom:24px;}
.detail-section h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#534AB7;margin-bottom:10px;border-bottom:1px solid #E8E3D8;padding-bottom:6px;}
.detail-row{display:flex;gap:16px;margin-bottom:8px;font-size:14px;align-items:center;}
.detail-label{width:180px;flex-shrink:0;color:#5F5E5A;}
.detail-input{flex:1;padding:8px 10px;border:1px solid #E8E3D8;border-radius:6px;font-size:14px;background:#fff;font-family:inherit;}
.detail-input:disabled{background:#F0EEE7;color:#888780;}
.detail-static{flex:1;font-size:14px;}
.field-note{font-size:11px;color:#888780;margin-top:2px;}
.modal-save-bar{position:static;background:#FDFAF5;padding-top:16px;margin-top:8px;border-top:1px solid #E8E3D8;display:flex;justify-content:flex-end;gap:10px;}
.btn-primary{padding:12px 24px;border:none;border-radius:8px;background:#534AB7;color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.btn-primary:hover{background:#443c99;}
.btn-small-outline{padding:6px 12px;font-size:12px;border:1px solid #534AB7;border-radius:6px;background:#fff;color:#534AB7;cursor:pointer;}

.toast{position:fixed;bottom:24px;right:24px;background:#2C2C2A;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;display:none;z-index:99;}
.empty-state{color:#888780;font-size:14px;padding:20px;text-align:center;}

@media (max-width: 768px) {
  nav{flex-direction:column;gap:10px;padding:14px 20px;}
  .detail-label{width:120px;}
  .modal-box{padding:20px;}
}
</style>
</head>
<body>


<main class="page-content">

  <div id="authLoading" style="text-align:center;padding:80px 20px;color:#888780;font-size:14px;">Loading…</div>

  <div id="pageContent" style="display:none;">
    <div class="top-bar">
      <div>
        <div class="eyebrow">Bloom Chiangmai</div>
        <h1>Team</h1>
      </div>
    </div>
    <p class="sub" style="margin-top:-24px;">Click on your own name to update your contact info.</p>

    <div class="directory-grid" id="directoryGrid"></div>

  </div>

  <div class="modal-overlay" id="profileModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeStaffProfile()">&times;</button>
      <h2 id="profileModalName">Staff Profile</h2>
      <p class="modal-sub" id="profileModalEmail"></p>

      <div id="profileFullView"></div>
      <div id="profileLimitedView" style="display:none;"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

</main>

<script>
let directoryCache = [];

async function onStaffReady(staffRow){
  loadDirectory();
}

async function loadDirectory(){
  const { data, error } = await sb.rpc('get_team_directory');
  directoryCache = data || [];
  renderDirectory();
}

function roleLabel(role){
  return {
    admin:'Admin', admissions:'Admissions', education_lead:'Education Lead',
    learning_coach:'Learning Coach', it:'IT', enrollment:'Enrollment'
  }[role] || role;
}

function renderDirectory(){
  const grid = document.getElementById('directoryGrid');
  if(!directoryCache.length){
    grid.innerHTML = '<div class="empty-state">No staff yet.</div>';
    return;
  }
  grid.innerHTML = directoryCache.map(s => `
    <div class="person-card" onclick="openStaffProfile('${s.id}')">
      <div class="person-name">${s.name}${s.id === window.currentStaff.id ? '<span class="you-badge">You</span>' : ''}</div>
      <div class="person-role">${roleLabel(s.role)}</div>
      ${s.job_title ? `<div class="person-detail">${s.job_title}</div>` : ''}
      <div class="person-detail">${s.staff_id_code || '—'}</div>
      <div class="person-detail">${s.email}</div>
      ${s.contact_phone ? `<div class="person-detail">${s.contact_phone}</div>` : ''}
    </div>
  `).join('');
}

async function openStaffProfile(staffId){
  const { data, error } = await sb.rpc('get_staff_profile', { target_staff_id: staffId });
  const dirEntry = directoryCache.find(x => x.id === staffId);

  document.getElementById('profileModalName').textContent = dirEntry ? dirEntry.name : 'Staff Profile';
  document.getElementById('profileModalEmail').textContent = dirEntry ? dirEntry.email : '';

  const isSelf = staffId === window.currentStaff.id;
  const isAdmin = window.currentStaffRole === 'admin' || window.currentStaffRole === 'it';

  if(data && data.length > 0){
    const s = data[0];
    const intake = s.intake_data || {};
    const canEditAdminFields = isAdmin;

    document.getElementById('profileFullView').style.display = 'block';
    document.getElementById('profileLimitedView').style.display = 'none';
    document.getElementById('profileFullView').innerHTML = `
      <div class="detail-section">
        <h3>Basic Info</h3>
        ${canEditAdminFields ? `
        <div class="detail-row"><div class="detail-label">Account email</div>
          <input class="detail-input" id="p-email" type="email" value="${s.email || ''}" data-original="${s.email || ''}">
        </div>` : ''}
        <div class="detail-row"><div class="detail-label">Job title</div>
          <select class="detail-input" id="p-job-title" ${canEditAdminFields ? '' : 'disabled'}>
            <option value="">— Select —</option>
            ${['Director','Education Lead','Education Consultant','Lead Teacher','Learning Coach','Learning Coach Assistant','Admissions Officer','Enrollment Coordinator','Front Desk / Office Manager','IT Support','Teaching Assistant'].map(title =>
              `<option value="${title}" ${s.job_title === title ? 'selected' : ''}>${title}</option>`
            ).join('')}
          </select>
        </div>
        ${!canEditAdminFields ? '<div class="field-note" style="margin-left:196px;">Contact an admin to change your job title.</div>' : ''}
        <div class="detail-row"><div class="detail-label">Phone</div><input class="detail-input" id="p-phone" value="${s.contact_phone || ''}"></div>
        <div class="detail-row"><div class="detail-label">Start date</div><input type="date" class="detail-input" id="p-start-date" value="${intake.start_date || ''}"></div>
        <div class="detail-row"><div class="detail-label">Date of birth</div><input type="date" class="detail-input" id="p-dob" value="${intake.date_of_birth || ''}"></div>
      </div>
      <div class="detail-section">
        <h3>Address & ID</h3>
        <div class="detail-row"><div class="detail-label">Home address</div><input class="detail-input" id="p-address" value="${intake.address || ''}"></div>
        <div class="detail-row"><div class="detail-label">National ID / Passport no.</div><input class="detail-input" id="p-national-id" value="${intake.national_id || ''}"></div>
        <div class="detail-row"><div class="detail-label">Nationality</div><input class="detail-input" id="p-nationality" value="${intake.nationality || ''}"></div>
      </div>
      <div class="detail-section">
        <h3>Emergency Contact</h3>
        <div class="detail-row"><div class="detail-label">Name</div><input class="detail-input" id="p-emergency-name" value="${intake.emergency_name || ''}"></div>
        <div class="detail-row"><div class="detail-label">Relationship</div><input class="detail-input" id="p-emergency-relationship" value="${intake.emergency_relationship || ''}"></div>
        <div class="detail-row"><div class="detail-label">Phone</div><input class="detail-input" id="p-emergency-phone" value="${intake.emergency_phone || ''}"></div>
      </div>
      ${canEditAdminFields ? `
      <div class="detail-section">
        <h3>Notes (Admin only)</h3>
        <div class="detail-row"><textarea class="detail-input" id="p-notes" rows="3" style="width:100%;">${s.notes || ''}</textarea></div>
      </div>` : ''}

      <div class="detail-section">
        <h3>Documents</h3>
        <div id="p-documents-list" style="margin-bottom:12px;"></div>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="file" id="p-document-upload" style="flex:1;font-size:13px;">
          <button class="btn-small-outline" onclick="uploadStaffDocument('${staffId}')">Upload</button>
        </div>
      </div>

      ${isSelf ? `
      <div class="detail-section">
        <h3>Password</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:10px;">
          <div>
            <div class="field-note" style="margin-left:0;margin-bottom:4px;">New password</div>
            <input type="password" class="detail-input" id="p-new-password" placeholder="At least 8 characters" style="width:100%;">
          </div>
          <div>
            <div class="field-note" style="margin-left:0;margin-bottom:4px;">Confirm password</div>
            <input type="password" class="detail-input" id="p-confirm-password" style="width:100%;">
          </div>
        </div>
        <button class="btn-small-outline" onclick="changeOwnPassword()">Update password</button>
        <div style="color:#B23A3A;font-size:13px;margin-top:8px;" id="passwordChangeError"></div>
        <div style="color:#2E6B2A;font-size:13px;margin-top:8px;" id="passwordChangeSuccess"></div>
      </div>` : (canEditAdminFields ? `
      <div class="detail-section">
        <h3>Password</h3>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="btn-small-outline" onclick="resetPasswordFromTeam('${staffId}')">Email reset link</button>
          <span style="font-size:12px;color:#888780;">or</span>
          <input type="password" id="p-admin-set-password" placeholder="Set password directly" style="flex:1;padding:6px 10px;border:1px solid #E8E3D8;border-radius:6px;font-size:13px;">
          <button class="btn-small-outline" onclick="setPasswordDirectlyFromTeam('${staffId}')">Set</button>
        </div>
      </div>` : '')}

      <div class="modal-save-bar">
        <button class="btn-small-outline" onclick="closeStaffProfile()">Cancel</button>
        <button class="btn-primary" onclick="saveStaffProfile('${staffId}')">Save changes</button>
      </div>
    `;
  } else {
    document.getElementById('profileFullView').style.display = 'none';
    document.getElementById('profileLimitedView').style.display = 'block';
    document.getElementById('profileLimitedView').innerHTML = `
      <div class="detail-section">
        <h3>Contact</h3>
        <div class="detail-row"><div class="detail-label">Role</div><div class="detail-static">${roleLabel(dirEntry?.role)}</div></div>
        <div class="detail-row"><div class="detail-label">Job title</div><div class="detail-static">${dirEntry?.job_title || '—'}</div></div>
        <div class="detail-row"><div class="detail-label">Email</div><div class="detail-static">${dirEntry?.email || '—'}</div></div>
        <div class="detail-row"><div class="detail-label">Phone</div><div class="detail-static">${dirEntry?.contact_phone || '—'}</div></div>
      </div>
      <div class="modal-save-bar">
        <button class="btn-small-outline" onclick="closeStaffProfile()">Close</button>
      </div>
    `;
  }

  document.getElementById('profileModal').classList.add('open');
  if(document.getElementById('p-documents-list')) loadStaffDocuments(staffId, isAdmin);
}

async function loadStaffDocuments(staffId, isAdmin){
  const { data, error } = await sb.from('staff_documents').select('*').eq('staff_id', staffId).order('uploaded_at', { ascending: false });
  const el = document.getElementById('p-documents-list');
  if(!el) return;
  if(error || !data || data.length === 0){
    el.innerHTML = '<div style="font-size:13px;color:#888780;">No documents uploaded yet.</div>';
    return;
  }
  el.innerHTML = data.map(d => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #E8E3D8;font-size:13px;">
      <span>${d.file_name}</span>
      <span>
        <button class="btn-small-outline" onclick="downloadStaffDocument('${d.file_path}')">Download</button>
        ${isAdmin ? `<button class="btn-small-danger" onclick="deleteStaffDocument('${d.id}','${d.file_path}','${staffId}')">Delete</button>` : ''}
      </span>
    </div>
  `).join('');
}

async function uploadStaffDocument(staffId){
  const fileInput = document.getElementById('p-document-upload');
  const file = fileInput.files[0];
  if(!file){ showToast('Choose a file first.'); return; }

  const filePath = `${staffId}/${Date.now()}_${file.name}`;
  const { error: uploadErr } = await sb.storage.from('staff-documents').upload(filePath, file);
  if(uploadErr){ showToast('Upload failed: ' + uploadErr.message); return; }

  const { error: metaErr } = await sb.from('staff_documents').insert({
    staff_id: staffId, file_path: filePath, file_name: file.name, uploaded_by: window.currentStaff.id
  });
  if(metaErr){ showToast('Error saving document record: ' + metaErr.message); return; }

  fileInput.value = '';
  showToast('Document uploaded.');
  const isAdmin = window.currentStaffRole === 'admin' || window.currentStaffRole === 'it';
  loadStaffDocuments(staffId, isAdmin);
}

async function downloadStaffDocument(filePath){
  const { data, error } = await sb.storage.from('staff-documents').createSignedUrl(filePath, 60);
  if(error){ showToast('Error: ' + error.message); return; }
  window.open(data.signedUrl, '_blank');
}

async function deleteStaffDocument(docId, filePath, staffId){
  const ok = confirm('Delete this document? This cannot be undone.');
  if(!ok) return;
  await sb.storage.from('staff-documents').remove([filePath]);
  const { error } = await sb.from('staff_documents').delete().eq('id', docId);
  if(error){ showToast('Error: ' + error.message); return; }
  showToast('Document deleted.');
  loadStaffDocuments(staffId, true);
}

function closeStaffProfile(){
  document.getElementById('profileModal').classList.remove('open');
}

async function resetPasswordFromTeam(staffId){
  const dirEntry = directoryCache.find(x => x.id === staffId);
  if(!dirEntry || !dirEntry.email){ showToast('No email on file for this staff member.'); return; }

  const { error } = await sb.auth.resetPasswordForEmail(dirEntry.email, {
    redirectTo: 'https://learn2bloom.org/staff-reset-password.html'
  });
  if(error){ showToast('Error: ' + error.message); return; }

  showToast('Reset link sent to ' + dirEntry.email + '. They can set their own new password from there.');
}

async function changeOwnPassword(){
  const pw = document.getElementById('p-new-password').value;
  const confirm = document.getElementById('p-confirm-password').value;
  const errEl = document.getElementById('passwordChangeError');
  const successEl = document.getElementById('passwordChangeSuccess');
  errEl.textContent = '';
  successEl.textContent = '';

  if(!pw || pw.length < 8){ errEl.textContent = 'Password must be at least 8 characters.'; return; }
  if(pw !== confirm){ errEl.textContent = 'Passwords do not match.'; return; }

  const { error } = await sb.auth.updateUser({ password: pw });
  if(error){ errEl.textContent = error.message; return; }

  document.getElementById('p-new-password').value = '';
  document.getElementById('p-confirm-password').value = '';
  successEl.textContent = 'Password updated.';
}

async function setPasswordDirectlyFromTeam(staffId){
  const newPassword = document.getElementById('p-admin-set-password').value;
  if(!newPassword || newPassword.length < 8){ showToast('Password must be at least 8 characters.'); return; }

  const { data: { session } } = await sb.auth.getSession();
  if(!session){ showToast('Session expired, please sign in again.'); return; }

  let res;
  try {
    res = await fetch('/.netlify/functions/reset-staff-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessToken: session.access_token, staffId, newPassword })
    });
  } catch (e) {
    showToast('Network error: ' + e.message);
    return;
  }

  const result = await res.json();
  if(!res.ok){
    showToast(result.error || 'Something went wrong.');
    return;
  }

  document.getElementById('p-admin-set-password').value = '';
  showToast('Password set for ' + result.name + '.');
}

async function saveStaffProfile(staffId){
  const v = id => document.getElementById(id) ? document.getElementById(id).value.trim() : undefined;
  const isAdmin = window.currentStaffRole === 'admin' || window.currentStaffRole === 'it';

  // If admin changed the email, update it via the secure function first.
  if(isAdmin && document.getElementById('p-email')){
    const emailInput = document.getElementById('p-email');
    const newEmail = emailInput.value.trim();
    const originalEmail = emailInput.dataset.original || '';
    if(newEmail && newEmail !== originalEmail){
      const { data: { session } } = await sb.auth.getSession();
      if(!session){ showToast('Session expired, please sign in again.'); return; }
      let res;
      try {
        res = await fetch('/.netlify/functions/update-staff-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken: session.access_token, staffId, newEmail })
        });
      } catch (e) {
        showToast('Network error updating email: ' + e.message);
        return;
      }
      const emailResult = await res.json();
      if(!res.ok){
        showToast(emailResult.error || 'Could not update email.');
        return;
      }
    }
  }

  const update = {
    contact_phone: v('p-phone') || null,
    intake_data: {
      start_date: v('p-start-date') || null,
      date_of_birth: v('p-dob') || null,
      address: v('p-address') || null,
      national_id: v('p-national-id') || null,
      nationality: v('p-nationality') || null,
      emergency_name: v('p-emergency-name') || null,
      emergency_relationship: v('p-emergency-relationship') || null,
      emergency_phone: v('p-emergency-phone') || null
    }
  };
  if(isAdmin){
    update.job_title = v('p-job-title') || null;
    update.notes = v('p-notes') || null;
  }

  const { error } = await sb.from('staff').update(update).eq('id', staffId);
  if(error){ showToast('Error saving profile: ' + error.message); return; }
  showToast('Profile saved.');
  closeStaffProfile();
  loadDirectory();
}

window.STAFF_PAGE_KEY = 'team';
checkStaffAndInit();
</script>

</body>
</html>
