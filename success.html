<script async src="https://www.googletagmanager.com/gtag/js?id=G-QH3NWGK088"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-QH3NWGK088');
// Contact click events (line_click, whatsapp_click, wechat_click): fire on clicks on any
// LINE, WhatsApp or WeChat link, and on taps on the QR image of the matching page.
var bcmChannels = [
  ['line_click', /line\.me|lin\.ee|116mdcau/, /\/line(\.html)?([?#]|$)/],
  ['whatsapp_click', /wa\.me|api\.whatsapp\.com|whatsapp:\/\//, /\/whatsapp(\.html)?([?#]|$)/],
  ['wechat_click', /weixin:\/\/|u\.wechat\.com|wechat\.com/, /\/wechat(\.html)?([?#]|$)/],
  ['email_click', /^mailto:/, /^mailto:/]
];
document.addEventListener('click', function (e) {
  var t = e.target;
  if (!t || !t.closest) return;
  var a = t.closest('a[href]');
  var url = a ? a.href.toLowerCase() : null, label = a ? (a.textContent || '').trim().slice(0, 100) : 'qr image';
  if (!a) {
    if (!t.closest('img.qr')) return;
    url = location.href.toLowerCase();
  }
  for (var i = 0; i < bcmChannels.length; i++) {
    var c = bcmChannels[i];
    if (c[1].test(url) || c[2].test(url)) {
      gtag('event', c[0], { link_url: a ? a.href : location.href, link_text: label });
      if (window.fbq) fbq('track', 'Contact', { content_name: c[0] });
      return;
    }
  }
}, true);
</script>
