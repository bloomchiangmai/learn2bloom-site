<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reset Password — Bloom Chiangmai</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="staff-shared.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:#FDFAF5;color:#2C2C2A;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.box{max-width:400px;width:100%;text-align:center;}
.logo{font-family:Georgia,serif;font-size:24px;font-weight:700;margin-bottom:36px;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;color:#534AB7;text-transform:uppercase;margin-bottom:14px;}
h1{font-family:Georgia,serif;font-size:30px;font-weight:700;margin-bottom:8px;}
.sub{font-size:14px;color:#5F5E5A;margin-bottom:28px;}
input{width:100%;padding:12px 14px;border:1px solid #E8E3D8;border-radius:8px;font-size:15px;margin-bottom:12px;background:#fff;}
button{width:100%;padding:12px;border:none;border-radius:8px;background:#534AB7;color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
button:hover{background:#443c99;}
.error-msg{color:#B23A3A;font-size:13px;margin-top:10px;}
.success-msg{color:#2E6B2A;font-size:13px;margin-top:10px;}
</style>
</head>
<body>

<div class="box">
  <div class="logo">Bloom Chiangmai</div>
  <div class="eyebrow">Staff Access</div>
  <h1 id="pageTitle">Set a new password</h1>
  <p class="sub" id="pageSub">Choose a new password for your account.</p>

  <div id="formView">
    <input type="password" id="newPassword" placeholder="New password">
    <input type="password" id="confirmPassword" placeholder="Confirm new password">
    <button onclick="submitNewPassword()">Set password</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div id="invalidView" style="display:none;">
    <p style="font-size:14px;color:#5F5E5A;">
      This reset link is invalid or has expired. Please ask an admin to send you a new one, or use the "Forgot password" link on the sign-in page.
    </p>
  </div>
</div>

<script>
(async function(){
  // A valid recovery link results in a session being established automatically
  // (supabase-js parses the token from the URL). If there's no session, the
  // link is invalid/expired.
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    document.getElementById('formView').style.display = 'none';
    document.getElementById('invalidView').style.display = 'block';
  }
})();

async function submitNewPassword(){
  const pw = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const errEl = document.getElementById('errorMsg');
  errEl.textContent = '';

  if(!pw || pw.length < 8){ errEl.textContent = 'Password must be at least 8 characters.'; return; }
  if(pw !== confirm){ errEl.textContent = 'Passwords do not match.'; return; }

  const { error } = await sb.auth.updateUser({ password: pw });
  if(error){ errEl.textContent = error.message; return; }

  document.getElementById('pageTitle').textContent = 'Password updated';
  document.getElementById('pageSub').textContent = 'Redirecting you to sign in…';
  document.getElementById('formView').style.display = 'none';
  await sb.auth.signOut();
  setTimeout(() => { window.location.href = 'staff-login.html'; }, 1500);
}
</script>

</body>
</html>
